/* ============================= OFFLINE DRAFT RESILIENCE ============================= */
// A consultation in progress lives only in the DOM/JS memory until "Save
// visit" successfully reaches the server. On a shaky connection — or if the
// tab is closed or reloaded by accident — that typed work would otherwise
// vanish with no way back. We snapshot the doctor's form into localStorage
// every few seconds while it's open, and offer to restore it the next time
// a blank consultation is opened. This is a local safety net only — it
// doesn't sync anything to the server by itself.
const VISIT_DRAFT_KEY = 'mmc_visit_draft';
function snapshotVisitFormFields(){
  const dv = state.draftVisit;
  if(!dv) return null;
  const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const prescriptions = [];
  document.querySelectorAll('[data-rx-idx]').forEach(row=>{
    const i = Number(row.getAttribute('data-rx-idx'));
    prescriptions[i] = {
      medicine: row.querySelector('[data-f="medicine"]')?.value || '',
      dosage: row.querySelector('[data-f="dosage"]')?.value || '',
      frequency: row.querySelector('[data-f="frequency"]')?.value || '',
      duration: row.querySelector('[data-f="duration"]')?.value || '',
      instructions: row.querySelector('[data-f="instructions"]')?.value || ''
    };
  });
  // Investigations are kept in state via the checklist; still merge any DOM notes if present
  const investigations = (state.draftVisit.investigations||[])
    .filter(r=>r && r.test)
    .map(r=>({test: r.test, notes: r.notes||''}));
  return {
    savedAt: Date.now(),
    patientId: dv.patientId, newPatient: dv.newPatient, editingVisitId: dv.editingVisitId,
    doctorName: val('v-doctor'),
    vitals: { bp: val('v-bp'), pulse: val('v-pulse'), temp: val('v-temp'), weight: val('v-weight'), height: val('v-height') },
    complaints: val('v-complaints'), examination: val('v-exam'),
    diagnosis: val('v-diagnosis'), notes: val('v-notes'), followUpDate: val('v-followup'),
    referredTo: val('v-referred-to'), referralReason: val('v-referral-reason'),
    prescriptions: prescriptions.length ? prescriptions : undefined,
    investigations: investigations.length ? investigations : undefined
  };
}
// True only if the doctor has actually typed/selected something worth
// protecting — an empty or barely-touched form isn't worth remembering,
// and remembering it anyway is exactly what caused the restore prompt to
// appear on every visit to this page, even ones with nothing entered.
function snapshotHasContent(snap){
  if(!snap) return false;
  if(snap.newPatient && (snap.newPatient.name || snap.newPatient.phone)) return true;
  if(snap.complaints || snap.examination || snap.diagnosis || snap.notes) return true;
  if(snap.followUpDate || snap.referredTo || snap.referralReason) return true;
  const v = snap.vitals || {};
  if(v.bp || v.pulse || v.temp || v.weight) return true;
  if((snap.prescriptions||[]).some(r => r && r.medicine)) return true;
  if((snap.investigations||[]).some(r => r && r.test)) return true;
  return false;
}
// Updates every draft-indicator element on the page (there are two: one
// pinned near the top of the form so it's seen without scrolling, one near
// the Save button). Both share the same markup so this stays in sync.
function setDraftIndicator(active, text){
  document.querySelectorAll('.js-draft-indicator').forEach(ind=>{
    ind.classList.toggle('draft-idle', !active);
    const label = ind.querySelector('.draft-label');
    if(label) label.textContent = text;
  });
}
function autosaveVisitDraft(){
  if(!state.data || !can('clinicalVisit') || state.route !== 'newVisit' || !state.draftVisit) return;
  const snap = snapshotVisitFormFields();
  if(!snapshotHasContent(snap)){
    setDraftIndicator(false, 'Nothing to autosave yet — start typing');
    return;
  }
  try{
    localStorage.setItem(VISIT_DRAFT_KEY, JSON.stringify(snap));
    const when = new Date(snap.savedAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    setDraftIndicator(true, `Draft saved on this device at ${when}`);
  } catch(e){
    setDraftIndicator(false, 'Autosave unavailable in this browser mode');
  }
}
function clearVisitDraftStorage(){
  try{ localStorage.removeItem(VISIT_DRAFT_KEY); } catch(e){}
}
function restoreVisitDraftIfAny(){
  if(!can('clinicalVisit')) return;
  let raw;
  try{ raw = localStorage.getItem(VISIT_DRAFT_KEY); } catch(e){ return; }
  if(!raw) return;
  let snap;
  try{ snap = JSON.parse(raw); } catch(e){ clearVisitDraftStorage(); return; }
  if(!snap || !snap.savedAt){ clearVisitDraftStorage(); return; }
  if(!snapshotHasContent(snap)){ clearVisitDraftStorage(); return; } // leftover from before this check existed
  if(Date.now() - snap.savedAt > 24*60*60*1000){ clearVisitDraftStorage(); return; } // stale, don't offer
  const when = new Date(snap.savedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  if(!confirm(`An unsaved consultation draft was found from ${when} (likely from a dropped connection, or the tab closing before it was saved). Restore it into this form?`)){
    clearVisitDraftStorage();
    return;
  }
  const dv = state.draftVisit;
  if(snap.patientId) dv.patientId = snap.patientId;
  if(snap.newPatient) dv.newPatient = snap.newPatient;
  if(snap.doctorName) dv.doctorName = snap.doctorName;
  dv.vitals = Object.assign({}, dv.vitals, snap.vitals||{});
  if(snap.complaints) dv.complaints = snap.complaints;
  if(snap.examination) dv.examination = snap.examination;
  if(snap.diagnosis) dv.diagnosis = snap.diagnosis;
  if(snap.notes) dv.notes = snap.notes;
  if(snap.followUpDate) dv.followUpDate = snap.followUpDate;
  if(snap.referredTo) dv.referredTo = snap.referredTo;
  if(snap.referralReason) dv.referralReason = snap.referralReason;
  if(snap.prescriptions && snap.prescriptions.length) dv.prescriptions = snap.prescriptions.map(r=>({medicine:'',dosage:'',frequency:'',duration:'',instructions:'',...r}));
  if(snap.investigations && snap.investigations.length) dv.investigations = snap.investigations.map(r=>({test:'',notes:'',...r}));
}
// A small pill with a pulsing dot — reused at the top of the OPD form (so
// it's visible without scrolling) and again near the Save button. Both
// copies are kept in sync by setDraftIndicator() via the js-draft-indicator
// class, so this markup must stay identical wherever it's used.
function draftIndicatorHTML(){
  return `<span class="draft-indicator draft-idle js-draft-indicator"><span class="draft-dot"></span><span class="draft-label">Autosaves as you work</span></span>`;
}
function cancelVisitFlow(){

  go(state.routeParams.patientId?'patient':'patients', state.routeParams.patientId?{patientId:state.routeParams.patientId}:{});
}
// Checked every 10s — cheap no-op unless a doctor has the visit form open.

/* ============================= PRESCRIPTION TEMPLATES ============================= */
// A named, reusable bundle of medicines + investigations (e.g. "Standard
// viral fever Rx") — saved from a visit in progress, applied into any
// later one so a repeat combination doesn't need retyping.
function applyRxTemplate(){
  const sel = document.getElementById('rx-template-select');
  if(!sel || sel.value==='') return;
  const t = (state.data.rxTemplates||[])[Number(sel.value)];
  if(!t) return;
  const dv = state.draftVisit;
  const rxIsBlank = dv.prescriptions.length===1 && !dv.prescriptions[0].medicine;
  const invIsBlank = dv.investigations.length===1 && !dv.investigations[0].test;
  dv.prescriptions = (rxIsBlank ? [] : dv.prescriptions).concat((t.prescriptions||[]).map(r=>({...r})));
  const mergedInv = (invIsBlank ? [] : dv.investigations).concat((t.investigations||[]).map(r=>({...r})));
  const seenTests = new Set();
  dv.investigations = mergedInv.filter(r=>{
    if(!r || !r.test) return false;
    const key = r.test.trim().toLowerCase();
    if(!key || seenTests.has(key)) return false; // already have this one — keep the first (preserves any notes already typed)
    seenTests.add(key);
    return true;
  });
  if(!dv.prescriptions.length) dv.prescriptions = [{medicine:'',dosage:'',frequency:'',duration:'',instructions:''}];
  document.getElementById('rx-rows').innerHTML = rxRowsHTML();
  document.getElementById('inv-rows').innerHTML = invRowsHTML();
}
async function saveCurrentAsTemplate(){
  const dv = state.draftVisit;
  // Pull the latest typed values off the DOM first, same as saveVisit() does.
  document.querySelectorAll('[data-rx-idx]').forEach(row=>{
    const i = Number(row.getAttribute('data-rx-idx'));
    dv.prescriptions[i] = {
      medicine: row.querySelector('[data-f="medicine"]').value.trim(),
      dosage: row.querySelector('[data-f="dosage"]').value.trim(),
      frequency: row.querySelector('[data-f="frequency"]').value.trim(),
      duration: row.querySelector('[data-f="duration"]').value.trim(),
      instructions: row.querySelector('[data-f="instructions"]').value.trim()
    };
  });
  // Checklist keeps investigations in state; ensure notes from selected rows are current
  dv.investigations = (dv.investigations||[]).filter(r=>r && r.test).map(r=>({test:r.test, notes:(r.notes||'').trim()}));
  const prescriptions = dv.prescriptions.filter(r=>r.medicine);
  const investigations = dv.investigations.filter(r=>r.test);
  if(!prescriptions.length && !investigations.length){
    alert('Add at least one medicine or test before saving it as a template.');
    return;
  }
  const name = prompt('Name this template (e.g. "Standard viral fever Rx"):');
  if(!name || !name.trim()) return;
  if(!state.data.rxTemplates) state.data.rxTemplates = [];
  state.data.rxTemplates.push({
    id: 'RXT'+Date.now().toString(36).toUpperCase(),
    name: name.trim(), prescriptions, investigations, createdAt: new Date().toISOString()
  });
  logAudit('Saved prescription template', `${name.trim()} — ${prescriptions.length} medicine(s), ${investigations.length} test(s)`);
  const ok = await saveData();
  if(!ok){ alert(state.saveError || 'Could not save the template — try again.'); return; }
  render();
}
async function removeRxTemplate(idx){
  const t = (state.data.rxTemplates||[])[idx];
  if(!t) return;
  if(!confirm(`Remove the "${t.name}" template?`)) return;
  state.data.rxTemplates.splice(idx,1);
  logAudit('Removed prescription template', t.name);
  await saveData();
  render();
}

async function saveVisit(){
  const dv = state.draftVisit;
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  // These fields only exist in the doctor's full form — on the receptionist's
  // check-in form they're simply absent, so dv keeps its existing (blank) values.
  if(document.getElementById('v-doctor') !== null){
    dv.doctorName = val('v-doctor');
    dv.complaints = val('v-complaints');
    dv.examination = val('v-exam');
    dv.diagnosis = val('v-diagnosis');
    dv.notes = val('v-notes');
    dv.followUpDate = val('v-followup');
    dv.referredTo = val('v-referred-to');
    dv.referralReason = val('v-referral-reason');
    dv.vitals.bp = val('v-bp');
    dv.vitals.pulse = val('v-pulse');
    dv.vitals.temp = val('v-temp');
    dv.vitals.weight = val('v-weight');
    if(document.getElementById('v-height')) dv.vitals.height = val('v-height');
  }
  if(document.getElementById('v-assigned-doctor') !== null){
    dv.assignedDoctor = val('v-assigned-doctor');
  }

  document.querySelectorAll('[data-rx-idx]').forEach(row=>{
    const i = Number(row.getAttribute('data-rx-idx'));
    dv.prescriptions[i] = {
      medicine: row.querySelector('[data-f="medicine"]').value.trim(),
      dosage: row.querySelector('[data-f="dosage"]').value.trim(),
      frequency: row.querySelector('[data-f="frequency"]').value.trim(),
      duration: row.querySelector('[data-f="duration"]').value.trim(),
      instructions: row.querySelector('[data-f="instructions"]').value.trim()
    };
  });
  // Checklist keeps investigations in state; ensure notes from selected rows are current
  dv.investigations = (dv.investigations||[]).filter(r=>r && r.test).map(r=>({test:r.test, notes:(r.notes||'').trim()}));

  const errEl = document.getElementById('visit-error');
  if(!dv.patientId && !dv.newPatient){
    errEl.textContent = 'Select an existing patient or register a new one.'; return;
  }
  if(dv.newPatient){
    dv.newPatient.name = document.getElementById('np-name').value.trim();
    dv.newPatient.dob = document.getElementById('np-dob').value;
    dv.newPatient.age = document.getElementById('np-age').value.trim();
    dv.newPatient.sex = document.getElementById('np-sex').value;
    dv.newPatient.phone = document.getElementById('np-phone').value.trim();
    dv.newPatient.address = document.getElementById('np-address').value.trim();
    dv.newPatient.allergies = document.getElementById('np-allergies') ? document.getElementById('np-allergies').value.trim() : '';
    dv.newPatient.chronicConditions = document.getElementById('np-chronic') ? document.getElementById('np-chronic').value.trim() : '';
    if(!dv.newPatient.name || (!dv.newPatient.dob && !dv.newPatient.age) || !dv.newPatient.sex || !dv.newPatient.phone || !dv.newPatient.address){
      errEl.textContent = 'New patient needs name, date of birth (or age), sex, phone and address.'; return;
    }
  } else if(dv.patientId){
    // Existing patient linked to this visit — their record should already
    // have these from registration. Skipped for a patient whose personal
    // details were deliberately cleared (see "Clear personal details"),
    // since blocking new visits for them would defeat that feature's point.
    const existingPatient = state.data.patients.find(p=>p.id===dv.patientId);
    if(existingPatient && !existingPatient.detailsRedacted){
      if(!existingPatient.name || (!existingPatient.dob && !existingPatient.age) || !existingPatient.sex || !existingPatient.phone || !existingPatient.address){
        errEl.textContent = `${existingPatient.name||'This patient'}'s record is missing some details (name, date of birth/age, sex, phone or address) — fill these in via "Edit details" on their patient page before saving a visit.`;
        return;
      }
    }
  }
  if(document.getElementById('v-doctor') !== null){
    if(!dv.vitals.bp || !dv.vitals.pulse || !dv.vitals.temp || !dv.vitals.weight){
      errEl.textContent = 'BP, pulse, temperature and weight are all required before saving.'; return;
    }
  }
  // Hard safety gate on top of the inline hint shown while typing: if any
  // prescribed medicine matches a listed allergy, require the doctor to
  // explicitly confirm before it can be saved, rather than something that
  // can just be scrolled past.
  const rxAllergyConflicts = (dv.prescriptions||[])
    .map(r=>({medicine:r.medicine, hit: r.medicine ? allergyMatch(r.medicine) : null}))
    .filter(x=>x.hit);
  const rxInter = findDrugInteractions(dv.prescriptions||[]);
  const rxDups = findDuplicateMeds(dv.prescriptions||[]);
  const hasRxSafetyIssue = !!(rxAllergyConflicts.length || rxInter.length || rxDups.length);
  if(hasRxSafetyIssue){
    const ack = document.getElementById('rx-safety-ack');
    const typed = document.getElementById('rx-safety-override');
    const okBox = ack && ack.checked;
    const okType = typed && typed.value.trim().toUpperCase() === 'OVERRIDE';
    if(!okBox || !okType){
      updateRxInteractionWarnings();
      errEl.textContent = 'Safety check: tick the acknowledgement and type OVERRIDE to save with allergy/interaction risks.';
      const panel = document.getElementById('rx-safety-ack');
      if(panel) panel.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    logAudit('Rx safety override', [
      rxAllergyConflicts.length ? 'allergy:'+rxAllergyConflicts.map(x=>x.medicine).join(',') : '',
      rxInter.length ? 'interact:'+rxInter.map(h=>h.group).join(',') : '',
      rxDups.length ? 'dup:'+rxDups.join(',') : ''
    ].filter(Boolean).join(' · '));
  }

  // First visit: allergy field must be acknowledged
  if(dv.patientId){
    const ep = state.data.patients.find(x=>x.id===dv.patientId);
    const visitCount = ep ? (ep.visits||[]).length : 0;
    const isFirst = !dv.editVisitId && visitCount===0;
    if(isFirst){
      const ack = document.getElementById('v-allergy-ack');
      const known = (ep && (ep.allergies||'').trim()) || (ack && ack.value && ack.value.trim());
      const noneKnown = ack && ack.dataset.none === '1';
      if(!known && !noneKnown){
        errEl.textContent = 'Record allergies on this first visit, or mark “None known”.';
        return;
      }
      if(ep && !ep.allergies && noneKnown) ep.allergies = 'None known';
      if(ep && ack && ack.value && ack.value.trim() && !ep.allergies) ep.allergies = ack.value.trim();
    }
  } else if(dv.newPatient){
    const ack = document.getElementById('np-allergies');
    const none = document.getElementById('np-allergy-none');
    if(ack && !(ack.value||'').trim() && !(none && none.checked)){
      errEl.textContent = 'Enter known allergies for a new patient, or tick “None known”.';
      return;
    }
    if(none && none.checked && ack && !(ack.value||'').trim()) dv.newPatient.allergies = 'None known';
  }
  // Pediatric visits: weight is mandatory for dosing safety
  if(document.getElementById('v-doctor') !== null && dv.patientId){
    const ep = state.data.patients.find(x=>x.id===dv.patientId);
    if(ep && isPediatricPatient(ep) && !dv.vitals.weight){
      errEl.textContent = 'Weight is required for pediatric visits (dose safety).'; return;
    }
  }
  // Duplicate same-day visit warning (new visits only)
  if(!dv.editVisitId && dv.patientId){
    const ep = state.data.patients.find(x=>x.id===dv.patientId);
    const today = todayStr();
    const sameDay = ep && (ep.visits||[]).some(v=>v.date===today);
    if(sameDay){
      if(!confirm('This patient already has a visit recorded today. Create another visit anyway?')) return;
    }
  }
  errEl.textContent = '';

  let patient;
  if(dv.newPatient){
    patient = {
      id: newPatientId(), name: dv.newPatient.name, dob: dv.newPatient.dob||'', age: dv.newPatient.age, sex: dv.newPatient.sex,
      phone: dv.newPatient.phone, address: dv.newPatient.address, allergies: dv.newPatient.allergies||'', chronicConditions: dv.newPatient.chronicConditions||'',
      registeredDate: todayStr(), visits: [], growthRecords: [], vaccinations: [], certificates: []
    };
    state.data.patients.push(patient);
  } else {
    patient = state.data.patients.find(p=>p.id===dv.patientId);
  }

  const prescriptions = dv.prescriptions.filter(r=>r.medicine);
  const investigations = dv.investigations.filter(r=>r.test);
  const status = dv.diagnosis ? 'completed' : 'waiting';

  let visit = dv.editingVisitId ? (patient.visits||[]).find(v=>v.id===dv.editingVisitId) : null;
  const wasExisting = !!visit;
  if(visit){
    // Continuing a visit the receptionist started — update in place, keep
    // the original id/date/time.
    visit.doctorName = dv.doctorName;
    visit.vitals = dv.vitals;
    visit.complaints = dv.complaints;
    visit.examination = dv.examination;
    visit.diagnosis = dv.diagnosis;
    visit.notes = dv.notes;
    visit.followUpDate = dv.followUpDate;
    visit.referredTo = dv.referredTo; visit.referralReason = dv.referralReason;
    visit.assignedDoctor = dv.assignedDoctor;
    visit.prescriptions = prescriptions;
    visit.investigations = investigations;
    visit.status = status;
    if(dv.attachments) visit.attachments = dv.attachments;
  } else {
    const feeEl = document.getElementById('v-checkin-fee');
    const paidEl = document.getElementById('v-checkin-paid');
    const modeEl = document.getElementById('v-checkin-mode');
    const billFee = feeEl ? feeEl.value.trim() : '';
    const billPaid = paidEl ? paidEl.value === 'true' : false;
    const billMode = modeEl ? modeEl.value : '';
    visit = {
      id: newVisitId(), token: nextTokenNumber(), date: todayStr(), time: nowTimeStr(),
      doctorName: dv.doctorName, vitals: dv.vitals,
      complaints: dv.complaints, examination: dv.examination, diagnosis: dv.diagnosis, notes: dv.notes,
      followUpDate: dv.followUpDate, assignedDoctor: dv.assignedDoctor||'',
      referredTo: dv.referredTo||'', referralReason: dv.referralReason||'',
      prescriptions, investigations, status,
      tokenStatus: status==='completed' ? 'done' : 'waiting',
      attachments: dv.attachments || [],
      billing: { fee: billFee, charges:[], paid: billPaid, mode: billMode }
    };
    patient.visits.unshift(visit);
  }
  if(wasExisting){
    if(status==='completed') visit.tokenStatus = 'done';
    else if(can('clinicalVisit') && tokenQueueStatus(visit)==='called') visit.tokenStatus = 'with_doctor';
    else if(!visit.tokenStatus) visit.tokenStatus = status==='completed'?'done':'waiting';
  }
  logAudit(wasExisting ? 'Updated visit' : 'Recorded visit', `${patient.name} (${patient.id}) — token #${visit.token!=null?visit.token:'—'} · ${fmtDate(visit.date)}${visit.doctorName?' · '+visit.doctorName:''}`);
  const ok = await saveData();
  if(!ok){ errEl.textContent = state.saveError; render(); return; }
  clearVisitDraftStorage();
  const wantNext = !!state.pendingPrintAndNext;
  state.pendingPrintAndNext = false;
  if(can('clinicalVisit') && (status==='completed' || wasExisting)){
    go('visitPrint', {patientId: patient.id, visitId: visit.id, printAndNext: wantNext});
  } else {
    if(visit.token!=null && !wasExisting){
      setTimeout(()=>printTokenSlip(patient.id, visit.id), 300);
    }
    go('dashboard');
  }
}

function recordLastPrinted(sheetId){
  if(state.route==='visitPrint' && state.routeParams.patientId && state.routeParams.visitId){
    state.data.lastPrinted = {
      patientId: state.routeParams.patientId,
      visitId: state.routeParams.visitId,
      at: new Date().toISOString(),
      sheet: sheetId || 'sheet-opd'
    };
    try{ saveData(); }catch(e){}
  }
}
function printSection(id){
  if(id==='sheet-opd' || id==='sheet-rx-only' || id==='sheet-inv' || id==='sheet-referral' || id==='sheet-receipt'){
    recordLastPrinted(id);
  }
  document.querySelectorAll('.print-sheet').forEach(el=>el.classList.remove('print-active'));
  const el = document.getElementById(id);
  if(!el){ alert('Nothing to print — open the document first.'); return; }
  el.classList.add('print-active');
  document.body.classList.remove('printing-token');
  const after = ()=>{
    el.classList.remove('print-active');
    window.removeEventListener('afterprint', after);
  };
  window.addEventListener('afterprint', after);
  window.print();
}
/** Opens a clean print window so the user can choose "Save as PDF". */
function saveSheetAsPdf(id){
  const el = document.getElementById(id);
  if(!el){ alert('Nothing to save — open the document first.'); return; }
  recordLastPrinted(id);
  const styles = Array.from(document.querySelectorAll('style')).map(s=>s.innerHTML).join('\n');
  const w = window.open('', '_blank', 'noopener,width=800,height=900');
  if(!w){ alert('Pop-up blocked. Allow pop-ups for this site, or use Print and choose “Save as PDF”.'); printSection(id); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>MMC document</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>${styles}
      body{background:#fff;margin:0;padding:12px;font-family:'Public Sans',sans-serif;color:#152033;}
      .print-sheet{display:block !important;box-shadow:none !important;border:1px solid #C9D3DE !important;max-width:640px;margin:0 auto;}
      .print-sheet *{visibility:visible !important;}
      @media print{body{padding:0;} .print-sheet{border:none !important;}}
    </style></head><body>${el.outerHTML}
    <script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script>
    </body></html>`);
  w.document.close();
}
function printPack(ids){
  const list = (ids||[]).filter(id => document.getElementById(id));
  if(!list.length){ alert('Nothing to print in this pack.'); return; }
  let i = 0;
  const runNext = ()=>{
    if(i >= list.length) return;
    const id = list[i++];
    document.querySelectorAll('.print-sheet').forEach(el=>el.classList.remove('print-active'));
    const el = document.getElementById(id);
    if(!el){ runNext(); return; }
    if(i === 1) recordLastPrinted(id);
    el.classList.add('print-active');
    document.body.classList.remove('printing-token');
    const after = ()=>{
      el.classList.remove('print-active');
      window.removeEventListener('afterprint', after);
      if(i < list.length) setTimeout(runNext, 400);
    };
    window.addEventListener('afterprint', after);
    window.print();
  };
  runNext();
}
function reprintLast(){
  const lp = state.data && state.data.lastPrinted;
  if(!lp || !lp.patientId || !lp.visitId){
    alert('No recent print recorded yet. Print an OPD card or prescription first.');
    return;
  }
  go('visitPrint', {patientId: lp.patientId, visitId: lp.visitId});
  setTimeout(()=>{
    const sheet = lp.sheet || 'sheet-opd';
    if(document.getElementById(sheet)) printSection(sheet);
    else if(document.getElementById('sheet-opd')) printSection('sheet-opd');
    else alert('Could not open the last printed visit.');
  }, 500);
}
function rxWhatsAppText(p, v){
  const ci = state.data.clinicInfo || {};
  const clinic = ci.name || 'MMC Clinic';
  const lines = [`Namaste ${p.name || ''},`, '', `Prescription from ${clinic}`];
  if(v && v.date) lines.push('Date: ' + fmtDate(v.date));
  if(v && v.diagnosis) lines.push('Diagnosis: ' + v.diagnosis);
  lines.push('');
  const rx = (v && v.prescriptions) || [];
  if(rx.length){
    lines.push('Medicines:');
    rx.forEach((r,i)=>{
      if(!r.medicine) return;
      const bits = [r.medicine];
      if(r.dosage) bits.push(r.dosage);
      if(r.frequency) bits.push(formatFrequencyDisplay(r.frequency) || r.frequency);
      if(r.duration) bits.push(daysLabel(r.duration) || r.duration);
      if(r.instructions) bits.push(r.instructions);
      lines.push((i+1) + '. ' + bits.join(' · '));
    });
  } else {
    lines.push('No medicines listed.');
  }
  if(v && v.followUpDate) lines.push('', 'Follow-up: ' + fmtDate(v.followUpDate));
  if(ci.phone) lines.push('', 'Clinic phone: ' + ci.phone);
  lines.push('', 'Please take medicines as advised.');
  return lines.join('\n');
}
function shareRxWhatsApp(patientId, visitId){
  const p = state.data.patients.find(x=>x.id===patientId);
  if(!p) return;
  const v = (p.visits||[]).find(x=>x.id===visitId);
  if(!p.phone){ alert('No phone number on this patient record.'); return; }
  shareWhatsApp(p.phone, rxWhatsAppText(p, v));
}

  const addrEl = document.getElementById('ci-address');
  const phoneEl = document.getElementById('ci-phone');
  const shortEl = document.getElementById('ci-short');
  if(!nameEl) return;
  state.data.clinicInfo.name = nameEl.value.trim() || state.data.clinicInfo.name;
  if(shortEl) state.data.clinicInfo.shortName = shortEl.value.trim();
  state.data.clinicInfo.address = addrEl ? addrEl.value.trim() : state.data.clinicInfo.address;
  state.data.clinicInfo.phone = phoneEl ? phoneEl.value.trim() : state.data.clinicInfo.phone;

function uploadClinicLogo(file){
  if(!isOwner()){ alert('Only the clinic admin can change the clinic logo.'); return; }
  const msg = document.getElementById('logo-upload-msg');
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){
    if(msg) msg.textContent = 'Please choose an image file.';
    return;
  }
  if(msg) msg.textContent = 'Uploading…';
  const reader = new FileReader();
  reader.onload = async () => {
    state.data.clinicInfo.logoDataUrl = reader.result;
    logAudit('Updated clinic logo', file.name);
    const ok = await saveData();
    const input = document.getElementById('logo-file-input');
    if(input) input.value = '';
    if(!ok){ if(msg) msg.textContent = state.saveError || 'Could not save — try again.'; return; }
    render();
  };
  reader.onerror = () => { if(msg) msg.textContent = "Couldn't read that file — try again."; };
  reader.readAsDataURL(file);
}
async function removeClinicLogo(){

  state.data.clinicInfo.logoDataUrl = '';

    return `<img src="${ci.logoDataUrl}" alt="" style="width:42px;height:42px;border-radius:11px;object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(201,148,18,0.25);">`;

// Shared prescription list card used on both the combined OPD card and the
// standalone "Prescription only" print sheet, so the two always match.
function rxCardHTML(prescriptions){
  if(!prescriptions || !prescriptions.length) return '';
  const prefs = typeof printPrefs==='function' ? printPrefs() : {};
  const showQty = prefs.showQtyOnRx !== false;
  return `<div class="opdx-rx-card">
    <div class="opdx-rx-head"><span class="opdx-rx-head-title">℞  ${esc(typeof printLabel==='function'?printLabel('Prescription','ಪ್ರಿಸ್ಕ್ರಿಪ್ಷನ್'):'Prescription')}</span></div>
    <div class="opdx-rx-body">
      ${prescriptions.map((r,i)=>{
        const days = daysLabel(r.duration);
        const freqShown = formatFrequencyDisplay(r.frequency);
        const qty = showQty ? computeQuantityLabel(r.medicine, r.frequency, r.duration, r.dosage) : '';
        let doseShown = (r.dosage||'').trim();
        if(isSyrupMedicine(r.medicine)){
          const ml = extractDoseMl(r.dosage, r.medicine);
          if(ml) doseShown = ml + ' ml';
        }
        const subParts = [
          doseShown ? `<span class="opdx-rx-dose">${esc(doseShown)}</span>` : '',
          freqShown ? `<span class="opdx-rx-freq">${esc(freqShown)}</span>` : '',
          days ? esc('× '+days) : '',
          r.instructions ? esc(r.instructions) : ''
        ].filter(Boolean).join(' · ');
        return `<div class="opdx-rx-item">
          <span class="opdx-rx-num">${i+1}</span>
          <span>
            <span class="opdx-rx-med">${esc(r.medicine)}</span>
            ${subParts?`<div class="opdx-rx-sub">${subParts}</div>`:''}
            ${qty?`<div class="opdx-rx-sub">${esc(qty)}</div>`:''}
          </span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function allergyChipsHTML(p){
  if(!p) return '';
  const prefs = typeof printPrefs==='function' ? printPrefs() : {};
  if(prefs.alwaysShowAllergyOnRx === false && !p.allergies && !p.chronicConditions) return '';
  if(!p.allergies && !p.chronicConditions) return '';
  return `<div class="opdx-alert-row">
    ${p.allergies?`<span class="opdx-alert-chip">⚠ Allergy — ${esc(p.allergies)}</span>`:''}
    ${p.chronicConditions?`<span class="opdx-alert-chip chronic">${esc(p.chronicConditions)}</span>`:''}
  </div>`;
}

function downloadTextFile(filename, text, mime){
  const blob = new Blob([text], {type: mime||'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function csvEscape(s){
  const t = String(s==null?'':s);
  if(/[",\n]/.test(t)) return '"'+t.replace(/"/g,'""')+'"';
  return t;
}
function exportPatientsCSV(){
  if(!isOwner()){ alert('Only the clinic admin can export patient data.'); return; }
  const rows = [['ID','Name','DOB','Age','Sex','Phone','Address','Allergies','Registered']];
  (state.data.patients||[]).forEach(p=>{
    rows.push([p.id,p.name,p.dob||'',displayAge(p),p.sex||'',p.phone||'',p.address||'',p.allergies||'',p.registeredDate||'']);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadTextFile('MM-patients-'+todayStr()+'.csv', csv, 'text/csv');
  logAudit('Exported patients CSV', rows.length-1+' patients');
}

async function downloadBackup(){
  if(!isOwner()){ alert('Only the clinic admin can download a full data backup.'); return; }
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mmc-clinic-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.data.lastBackupAt = new Date().toISOString();
  logAudit('Downloaded full backup', '');
  try{ await saveData(); }catch(e){}
}
async function restoreBackup(file){
  const msg = document.getElementById('restore-msg');
  if(!file) return;
  if(!isOwner()){
    if(msg) msg.textContent = 'Only the clinic admin can restore from a backup.';
    document.getElementById('restore-file-input').value = '';
    return;
  }
  if(!confirm('This will replace every patient, visit, appointment and staff record currently in the system with the contents of this backup file. This cannot be undone. Continue?')){
    document.getElementById('restore-file-input').value = '';
    return;
  }
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.patients) || !Array.isArray(parsed.staff)){
      throw new Error('not a clinic backup file');
    }
    const restored = Object.assign(defaultData(), parsed);
    const restoredBy = state.session.staffName || 'System';
    state.data = restored;
    bootClinicGuards();
    logAudit('Restored data from backup', `File: ${file.name}`, restoredBy);
    const ok = await saveData();
    document.getElementById('restore-file-input').value = '';
    if(!ok){ msg.textContent = state.saveError || 'Could not save the restored data — try again.'; return; }
    msg.textContent = '';
    // The logged-in staff account may not exist in the restored data.
    if(!state.data.staff.some(s=>s.name===state.session.staffName)){
      state.session.staffName = null;
      fetch('/api/logout', {method:'POST', credentials:'same-origin'}).catch(()=>{});
    }
    render();
  } catch(e){
    document.getElementById('restore-file-input').value = '';
    msg.textContent = "Couldn't read that file — make sure it's an MMC backup JSON file.";
  }
}
async function addStaff(){
  if(!isOwner()){ alert('Only the clinic admin can add staff accounts.'); return; }
  const name = document.getElementById('st-name').value.trim();
  const role = document.getElementById('st-role').value;
  const authMethod = (document.getElementById('st-auth-method')||{}).value === 'password' ? 'password' : 'pin';
  const pin = ((document.getElementById('st-pin')||{}).value || '').trim();
  const password = (document.getElementById('st-password')||{}).value || '';
  const qualification = (document.getElementById('st-qualification')||{}).value.trim() || '';
  const err = document.getElementById('st-error');
  if(!name){ err.textContent = 'Enter a name.'; return; }
  if(authMethod === 'pin'){
    if(!/^\d{4}$/.test(pin)){ err.textContent = 'Enter a 4-digit PIN.'; return; }
  } else {
    if(password.length < 6){ err.textContent = 'Password must be at least 6 characters.'; return; }
  }
  if(state.data.staff.some(s=>s.name===name)){ err.textContent = 'That name is already registered.'; return; }
  const recoveryCode = generateRecoveryCode();
  const record = {
    name, role, authMethod,
    qualification,
    owner: false,
    recoveryHash: await hashSecret(recoveryCode.replace(/-/g,'').toUpperCase())
  };
  if(authMethod === 'pin') record.pin = await hashPin(pin);
  else record.password = await hashSecret(password);
  state.data.staff.push(record);
  logAudit('Added staff account', `${name} (${role}) · ${authMethod}${qualification?' · '+qualification:''}`);
  await saveData();
  alert(`Account created for ${name}.\n\nRecovery code (give this to them once — it will not be shown again):\n\n${recoveryCode}`);
  render();
}

async function removeStaff(name){
  if(!isOwner()){ alert('Only the clinic admin can remove staff accounts.'); return; }
  if(name === state.session.staffName){ return; }
  const target = state.data.staff.find(s=>s.name===name);
  if(target && target.owner){ alert('Cannot remove the clinic admin account.'); return; }
  if(!confirm(`Remove staff account "${name}"? They will no longer be able to log in.`)) return;
  state.data.staff = state.data.staff.filter(s=>s.name!==name);
  logAudit('Removed staff account', name);
  await saveData();
  render();
}
// Renaming isn't offered here: a staff name is used as the identifying key
// throughout visits, appointments and the audit log, so changing it would
// orphan that history. Role and PIN are safe to change in place (admin only).
async function changeStaffRole(name){
  if(!isOwner()){ alert('Only the clinic admin can change staff roles.'); return; }
  const s = state.data.staff.find(s=>s.name===name);
  if(!s) return;
  const roles = ['Doctor','Receptionist','Staff'];
  const entered = prompt(`New role for ${name} (${roles.join(' / ')}):`, s.role);
  if(entered === null) return;
  const role = roles.find(r=>r.toLowerCase()===entered.trim().toLowerCase());
  if(!role){ alert(`Role must be one of: ${roles.join(', ')}`); return; }
  if(role === s.role) return;
  const oldRole = s.role;
  s.role = role;
  logAudit('Changed staff role', `${name}: ${oldRole} → ${role}`);
  await saveData();
  render();
}
async function resetStaffPin(name){
  if(!isOwner()){ alert('Only the clinic admin can reset staff logins.'); return; }
  const s = state.data.staff.find(s=>s.name===name);
  if(!s) return;
  const methodChoice = prompt(`Login type for ${name}: type PIN or PASSWORD`, (s.authMethod==='password'?'PASSWORD':'PIN'));
  if(methodChoice === null) return;
  const authMethod = /pass/i.test(methodChoice) ? 'password' : 'pin';
  if(authMethod === 'pin'){
    const entered = prompt(`New 4-digit PIN for ${name}:`);
    if(entered === null) return;
    const pin = entered.trim();
    if(!/^\d{4}$/.test(pin)){ alert('PIN must be exactly 4 digits.'); return; }
    s.pin = await hashPin(pin);
    delete s.password;
  } else {
    const entered = prompt(`New password for ${name} (min 6 characters):`);
    if(entered === null) return;
    const pw = entered.trim();
    if(pw.length < 6){ alert('Password must be at least 6 characters.'); return; }
    s.password = await hashSecret(pw);
    delete s.pin;
  }
  s.authMethod = authMethod;
  const recoveryCode = generateRecoveryCode();
  s.recoveryHash = await hashSecret(recoveryCode.replace(/-/g,'').toUpperCase());
  logAudit('Reset staff credentials', `${name} · ${authMethod}`);
  await saveData();
  alert(`Login updated for ${name} (${authMethod}).\n\nNew recovery code (show them once):\n\n${recoveryCode}`);
  render();
}
async function saveStaffProfileEdit(name){

const DASH_PANEL_META = [

function currentStaffRecord(){
  return (state.data.staff||[]).find(s=>s.name===state.session.staffName) || null;
}
function getDashboardPrefs(){
  const s = currentStaffRecord();
  const prefs = (s && s.dashboardPrefs) ? s.dashboardPrefs : {};
  const order = Array.isArray(prefs.order) && prefs.order.length
    ? prefs.order.filter(id => DASH_DEFAULT_ORDER.includes(id))
    : DASH_DEFAULT_ORDER.slice();
  // append any new panels not in saved order
  DASH_DEFAULT_ORDER.forEach(id=>{ if(!order.includes(id)) order.push(id); });
  const hidden = Array.isArray(prefs.hidden) ? prefs.hidden.filter(id => DASH_DEFAULT_ORDER.includes(id)) : [];
  return { order, hidden };
}
async function saveDashboardPrefs(prefs){
  const s = currentStaffRecord();
  if(!s) return;
  s.dashboardPrefs = { order: prefs.order.slice(), hidden: prefs.hidden.slice() };
  await saveData();
}
function isDashPanelVisible(id){
  if(state.dashboardCustomize) return true; // show all while editing
  const { hidden } = getDashboardPrefs();
  return !hidden.includes(id);
}
async function toggleDashPanelHidden(id){
  const prefs = getDashboardPrefs();
  if(prefs.hidden.includes(id)) prefs.hidden = prefs.hidden.filter(x=>x!==id);
  else prefs.hidden.push(id);
  await saveDashboardPrefs(prefs);
  render();
}
async function moveDashPanel(id, dir){
  const prefs = getDashboardPrefs();
  const i = prefs.order.indexOf(id);
  if(i<0) return;
  const j = i + dir;
  if(j<0 || j>=prefs.order.length) return;
  const t = prefs.order[i]; prefs.order[i]=prefs.order[j]; prefs.order[j]=t;
  await saveDashboardPrefs(prefs);
  render();
}
function toggleDashboardCustomize(){
  state.dashboardCustomize = !state.dashboardCustomize;
  render();
}

function dashPanelWrap(id, innerHTML){
  if(!innerHTML) return '';
  if(!state.dashboardCustomize && !isDashPanelVisible(id)) return '';
  const prefs = getDashboardPrefs();
  const hidden = prefs.hidden.includes(id);
  const edit = state.dashboardCustomize ? `
    <div class="dash-panel-edit">
      <span class="pill">${esc((DASH_PANEL_META.find(p=>p.id===id)||{}).label||id)}</span>
      <span class="pill" style="${hidden?'background:var(--danger-tint);color:var(--danger)':''}">${hidden?'Hidden':'Visible'}</span>
      <button class="btn btn-sm" onclick="toggleDashPanelHidden('${id}')">${hidden?'Show':'Hide'}</button>

  return `<div class="dash-panel-slot" data-panel="${id}">${edit}${hidden && state.dashboardCustomize ? `<div style="opacity:0.45">${innerHTML}</div>` : innerHTML}</div>`;

  const followUps = [];
  state.data.patients.forEach(p=>{
    (p.visits||[]).forEach(v=>{
      if(v.date===today) todaysVisits.push({patient:p, visit:v});
      if(visitStatus(v)==='waiting' && (!can('clinicalVisit') || !v.assignedDoctor || v.assignedDoctor===state.session.staffName)) waitingVisits.push({patient:p, visit:v});
      if(v.followUpDate && v.followUpDate<=today) followUps.push({patient:p, visit:v});
    });
  });
  todaysVisits.sort((a,b)=> (b.visit.time||'').localeCompare(a.visit.time||''));
  waitingVisits.sort((a,b)=>{
    const ta = a.visit.token||9999, tb = b.visit.token||9999;
    if(ta!==tb) return ta-tb;
    return (a.visit.time||'').localeCompare(b.visit.time||'');
  });
  followUps.sort((a,b)=> a.visit.followUpDate.localeCompare(b.visit.followUpDate));

  const showClinical = can('viewClinical');
  const myVisitsOnly = can('clinicalVisit') && state.dashboardMineOnly;
  const shownTodaysVisits = myVisitsOnly ? todaysVisits.filter(({visit})=> visit.doctorName===state.session.staffName) : todaysVisits;
  const ci = state.data.clinicInfo || {};
  const shortName = ((ci.shortName || 'MMC').replace(/[^A-Za-z]/g,'').slice(0,3) || 'MMC').toUpperCase();

  function waitingMins(visit){
    if(!visit.time) return null;
    try{
      const [hh,mm] = visit.time.split(':').map(Number);
      const then = new Date(); then.setHours(hh, mm||0, 0, 0);
      return Math.max(0, Math.round((Date.now() - then.getTime()) / 60000));
    }catch(e){ return null; }
  }

  const longWaitVisits = waitingVisits.filter(({visit})=>{
    const m = waitingMins(visit);
    return m!=null && m >= noShowMinutes();
  });
  const waitingRows = waitingVisits.slice(0, 20).map(({patient,visit})=>{
    const mins = waitingMins(visit);
    const isLong = mins!=null && mins >= noShowMinutes();
    const waitLabel = mins!=null ? ((isLong?'Long wait ':'')+`waiting ${mins} min`) : (visit.time || '');
    const lastDx = showClinical ? ((patient.visits||[]).filter(x=>x.id!==visit.id && x.diagnosis).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||{}).diagnosis : '';
    const click = can('clinicalVisit')
      ? `startTokenConsult('${patient.id}','${visit.id}')`
      : `go('patient',{patientId:'${patient.id}'})`;
    const stTok = tokenQueueStatus(visit);
    return `
    <div class="dbx-qrow dbx-clickable ${isLong?'long-wait-row':''}" onclick="${click}">
      <div class="dbx-qtoken-lg">${visit.token!=null?'#'+visit.token:''}</div>
      <div class="dbx-avatar ${avatarColorClass(patient.name)}">${esc(initialsOf(patient.name))}</div>
      <div class="dbx-qtext">
        <div class="dbx-qname">${esc(patient.name)} ${stTok==='called'?'<span class="pill">Called</span>':stTok==='with_doctor'?'<span class="pill">With doctor</span>':''}${isLong?' <span class="pill" style="background:var(--danger-tint);color:var(--danger);">Long wait</span>':''}</div>
        <div class="dbx-qsub">${esc(patient.id)}${waitLabel ? ' · <span class="'+(isLong?'long-wait':'')+'">'+esc(waitLabel)+'</span>' : ''}${patient.allergies && showClinical ? ' · ⚠ '+esc(patient.allergies) : ''}${lastDx ? ' · last: '+esc(lastDx) : ''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;">
        ${can('clinicalVisit')
          ? `<button class="dbx-qbtn" onclick="event.stopPropagation();startTokenConsult('${patient.id}','${visit.id}')">Open consult</button>
             <button class="dbx-qbtn ghost" onclick="event.stopPropagation();go('patient',{patientId:'${patient.id}'})">File</button>`
          : `<button class="dbx-qbtn ghost" onclick="event.stopPropagation();callSpecificToken('${patient.id}','${visit.id}')">Call</button>
             <button class="dbx-qbtn ghost" onclick="event.stopPropagation();printTokenSlip('${patient.id}','${visit.id}')">${t('Print token')}</button>
             <span class="dbx-qstatus wait">${stTok==='called'?'Called':'Waiting'}</span>`}
      </div>
    </div>`;
  }).join('');


  const longWaitCard = longWaitVisits.length ? `
    <div class="dbx-panel long-wait-panel" style="margin-bottom:14px;border-color:var(--danger);">
      <div class="dbx-panel-head">
        <h2 style="color:var(--danger);">Long waits${` <span class="count">${longWaitVisits.length}</span>`}</h2>
        <span class="faint">Over ${noShowMinutes()} min</span>
      </div>
      ${longWaitVisits.slice(0,8).map(({patient,visit})=>{
        const mins = waitingMins(visit);
        return `<div class="dbx-qrow">
          <div class="dbx-qtoken-lg">#${visit.token!=null?visit.token:'—'}</div>
          <div class="dbx-qtext">
            <div class="dbx-qname">${esc(patient.name)}</div>
            <div class="dbx-qsub"><span class="long-wait">${mins} min waiting</span> · ${esc(patient.id)}</div>
          </div>
          <div style="display:flex;gap:6px;">
            ${can('clinicalVisit')
              ? `<button class="dbx-qbtn" onclick="startTokenConsult('${patient.id}','${visit.id}')">Open</button>`
              : `<button class="dbx-qbtn" onclick="callSpecificToken('${patient.id}','${visit.id}')">Call</button>`}
            <button class="dbx-qbtn ghost" onclick="markNoShow('${patient.id}','${visit.id}')">No-show</button>
          </div>
        </div>`;
      }).join('')}
    </div>` : '';

  const rows = shownTodaysVisits.slice(0, 10).map(({patient,visit})=>{
    const st = visitStatus(visit);
    return `
    <div class="dbx-qrow dbx-clickable" onclick="go('visitPrint',{patientId:'${patient.id}',visitId:'${visit.id}'})">
      <div class="dbx-qtime">${esc(visit.time||'')}</div>
      <div class="dbx-avatar ${avatarColorClass(patient.name)}">${esc(initialsOf(patient.name))}</div>
      <div class="dbx-qtext">
        <div class="dbx-qname">${esc(patient.name)} <span class="pill">${patient.id}</span></div>
        <div class="dbx-qsub">${showClinical ? (esc(visit.diagnosis)||'—') : '&nbsp;'}${visit.doctorName?' · '+esc(visit.doctorName):''}</div>
      </div>
      <span class="dbx-qstatus ${st==='waiting'?'wait':'done'}">${st==='waiting'?'Waiting':'Completed'}</span>
    </div>`;
  }).join('');

  const followUpRows = followUps.slice(0,12).map(({patient,visit})=>{
    const d = new Date(visit.followUpDate+'T00:00:00');
    const dayNum = isNaN(d) ? '—' : d.getDate();
    const monLabel = isNaN(d) ? '' : d.toLocaleDateString('en-IN',{month:'short'});
    return `
    <div class="dbx-followup-item">
      <div class="dbx-fdate"><div class="d">${dayNum}</div><div class="m">${esc(monLabel)}</div></div>
      <div class="dbx-qtext">
        <div class="dbx-qname">${esc(patient.name)} <span class="pill">${patient.id}</span></div>
        <div class="dbx-qsub">${esc(visit.diagnosis)||'—'}${visit.followUpDate<today?' · overdue':''}</div>
      </div>
      <div class="dbx-followup-actions">
        <button class="dbx-qbtn" onclick="go('newVisit',{patientId:'${patient.id}'})">Visit</button>
        ${patient.phone?`<button class="dbx-qbtn ghost" onclick="shareWhatsApp(${jsAttr(patient.phone)}, patientWhatsAppText(state.data.patients.find(x=>x.id===${jsAttr(patient.id)}), 'Your follow-up is due. Please visit the clinic.'))">${t('WhatsApp')}</button>`:''}
        <button class="dbx-qbtn ghost" onclick="markFollowUpDone('${patient.id}','${visit.id}')">Done</button>
      </div>
    </div>`;
  }).join('');
  const followUpCard = `
    <div class="dbx-panel">
      <div class="dbx-panel-head"><h2>${t('Follow-ups due')}${followUps.length?` <span class="count">${followUps.length}</span>`:''}</h2></div>
      ${followUps.length ? followUpRows
        : `<div style="padding:0 4px;">${emptyState('✅', 'No follow-ups due', 'Follow-up dates set during a visit will surface here when they are due.')}</div>`}
    </div>`;

  const pedDueList = pediatricPatients().map(p=>{
    const due = vaccinationDueSummary(p);
    return {p, due};
  }).filter(x=>(x.due.overdue||x.due.due)).sort((a,b)=>(b.due.overdue||0)-(a.due.overdue||0)).slice(0,12);
  const pedDueRows = pedDueList.map(({p,due})=>`
    <div class="dbx-qrow">
      <div class="dbx-avatar ${avatarColorClass(p.name)}" onclick="state.pedLinkedPatientId='${p.id}';state.pedTab='immunization';go('pediatrics')">${esc(initialsOf(p.name))}</div>
      <div class="dbx-qtext" onclick="state.pedLinkedPatientId='${p.id}';state.pedTab='immunization';go('pediatrics')" style="cursor:pointer;">
        <div class="dbx-qname">${esc(p.name)} <span class="pill">${p.id}</span></div>
        <div class="dbx-qsub">${esc(opdAgeDisplay(p))} · ${due.overdue?due.overdue+' overdue':''}${due.overdue&&due.due?' / ':''}${due.due?due.due+' due':''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        ${p.phone?`<button class="dbx-qbtn ghost" onclick="event.stopPropagation();remindVaccineWhatsApp('${p.id}')">${t('WhatsApp')}</button>`:''}
        <span class="dbx-qstatus wait">${due.overdue?'Overdue':'Due'}</span>
      </div>
    </div>`).join('');
  const pedDueCard = `
    <div class="dbx-panel">
      <div class="dbx-panel-head">
        <h2>Pediatric vaccines due${pedDueList.length?` <span class="count">${pedDueList.length}</span>`:''}</h2>
        <div class="row" style="gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="remindAllVaccineDue()">WhatsApp all</button>
          <button class="btn btn-ghost btn-sm" onclick="go('pediatrics')">Open</button>
        </div>
      </div>
      ${pedDueList.length ? pedDueRows
        : `<div style="padding:0 4px;">${emptyState('💉', 'No overdue vaccines in the list', 'Children under 16 with due or overdue IAP/UIP doses appear here.')}</div>`}
    </div>`;

  const quickActionsCard = `
    <div class="dbx-panel">
      <div class="dbx-panel-head"><h2>Quick actions</h2></div>
      <div class="dbx-quick-actions">
        <button class="dbx-qbtn wide" onclick="go('newPatient')">+ Register new patient</button>
        <button class="dbx-qbtn wide" onclick="go('newAppointment')">+ Book appointment</button>
        ${can('certificates')?`<button class="dbx-qbtn wide" onclick="state.certPatientId=null;state.search='';go('certificates')">+ Issue certificate</button>`:''}
        ${can('pediatrics')?`<button class="dbx-qbtn wide" onclick="go('pediatrics')">🧒 Pediatrics tools</button>`:''}
      </div>
    </div>`;

  const hero = `
    <div class="dbx-hero">
      <div class="dbx-hero-top">
        <div class="dbx-hero-brand">
          ${brandMarkHTML({size:48,className:'dbx-hero-mark'})}
          <div class="dbx-hero-clinic">${esc(ci.name || 'Male Madeshwara Clinic')}</div>
        </div>
        <button class="dbx-hero-bell" title="Appointments" onclick="go('appointments')" aria-label="Appointments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
      <div class="dbx-hero-greet-eyebrow">${greetingWord()}</div>
      <div class="dbx-hero-greet-name">${esc(state.session.staffName)}</div>
      <div class="dbx-hero-stats">
        <div class="dbx-hero-stat">
          <div class="dbx-hero-stat-icon wait">${navIcon('statPatients')}</div>
          <div>
            <div class="dbx-hero-stat-num">${waitingVisits.length}</div>
            <div class="dbx-hero-stat-label">Waiting now</div>
          </div>
        </div>
        <div class="dbx-hero-stat">
          <div class="dbx-hero-stat-icon visits">${navIcon('statVisits')}</div>
          <div>
            <div class="dbx-hero-stat-num">${todaysVisits.length}</div>
            <div class="dbx-hero-stat-label">Today's visits</div>
          </div>
        </div>
      </div>
    </div>`;

  const ctaRow = `
    <div class="dbx-cta-row">
      <button class="dbx-cta-primary" onclick="go('newVisit')">+ New visit</button>
      <button class="dbx-cta-secondary" onclick="go('newAppointment')">Book appointment</button>
    </div>`;

  const queueSection = `
    <div class="dbx-section-head">
      <h2>Token queue</h2>
      <span class="faint">Next token #${peekNextTokenNumber()}</span>
    </div>
    ${tokenBoardHTML()}
    ${(()=>{
      const missed = missedTokenEntries();
      if(!missed.length) return '';
      return `<div class="dbx-panel" style="margin-bottom:12px;"><div class="dbx-panel-head"><h2>Missed / long-called${` <span class="count">${missed.length}</span>`}</h2></div>
        ${missed.map(({patient,visit})=>`
          <div class="dbx-qrow missed-row">
            <div class="dbx-qtoken-lg">#${visit.token!=null?visit.token:''}</div>
            <div class="dbx-qtext"><div class="dbx-qname">${esc(patient.name)}</div>
              <div class="dbx-qsub">${tokenQueueStatus(visit)==='no_show'?'No-show':'Called, not seen'}</div></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${can('clinicalVisit')?`<button class="dbx-qbtn" onclick="startTokenConsult('${patient.id}','${visit.id}')">Open</button>`:''}
              <button class="dbx-qbtn ghost" onclick="reclaimMissedToken('${patient.id}','${visit.id}')">Back to queue</button>
              <button class="dbx-qbtn ghost" onclick="markNoShow('${patient.id}','${visit.id}')">No-show</button>
            </div>
          </div>`).join('')}
      </div>`;
    })()}
    <div class="dbx-section-head">
      <h2>Waiting list</h2>
      <button class="link" onclick="go('patients')">View all</button>
    </div>
    <div class="dbx-queue-card">
      ${waitingVisits.length
        ? waitingRows
        : `<div style="padding:8px 4px;">${emptyState('🪑', 'No one waiting', 'Check in a patient to issue a token and add them to today’s queue.',
            `<button class="btn btn-accent btn-sm" onclick="go('newVisit')">+ Check in</button>`)}</div>`}
    </div>`;

  const tomorrow = tomorrowStr();
  const tomorrowAppts = appointmentsForDate(tomorrow).filter(a=>a.status==='booked' || !a.status);
  const apptRemindRows = tomorrowAppts.slice(0,10).map(a=>{
    const phone = a.phone || (a.patientId && (state.data.patients.find(p=>p.id===a.patientId)||{}).phone) || '';
    const name = a.name || (a.patientId && (state.data.patients.find(p=>p.id===a.patientId)||{}).name) || 'Patient';
    return `<div class="dbx-qrow">
      <div class="dbx-qtime">${esc(a.time||'')}</div>
      <div class="dbx-qtext">
        <div class="dbx-qname">${esc(name)}</div>
        <div class="dbx-qsub">${esc(a.doctorName||'')}${phone?' · '+esc(phone):''}</div>
      </div>
      ${phone?`<button class="dbx-qbtn" onclick="remindApptWhatsApp(${jsAttr(a.id)})">${t('WhatsApp')}</button>`:''}
    </div>`;
  }).join('');
  const apptRemindCard = `
    <div class="dbx-panel">
      <div class="dbx-panel-head"><h2>${t('Call tomorrow')}${tomorrowAppts.length?` <span class="count">${tomorrowAppts.length}</span>`:''}</h2></div>
      ${tomorrowAppts.length ? apptRemindRows
        : `<div style="padding:0 4px;">${emptyState('📅', 'No appointments tomorrow', 'Booked appointments for tomorrow appear here so you can send reminders.')}</div>`}
    </div>`;

  const statsGrid = `
    <div class="dbx-stat-grid">
      <div class="dbx-stat-card"><div class="dbx-stat-icon blue">${navIcon('statPatients')}</div><div><div class="dbx-stat-num">${state.data.patients.length}</div><div class="dbx-stat-label">Total patients</div></div></div>
      <div class="dbx-stat-card"><div class="dbx-stat-icon navy">${navIcon('statAppt')}</div><div><div class="dbx-stat-num">${appointmentsForDate(today).filter(a=>a.status==='booked').length}</div><div class="dbx-stat-label">Appointments today</div></div></div>
      <div class="dbx-stat-card"><div class="dbx-stat-icon teal">${navIcon('pediatrics')}</div><div><div class="dbx-stat-num">${pediatricPatients().length}</div><div class="dbx-stat-label">Pediatric patients</div></div></div>
    </div>`;

  const todayVisitsPanel = `
    <div class="dbx-panel">
      <div class="dbx-panel-head">
        <h2>Today's visits${shownTodaysVisits.length?` <span class="count">${shownTodaysVisits.length}</span>`:''}</h2>
        ${can('clinicalVisit') ? `<div class="dbx-seg">
          <button class="${!state.dashboardMineOnly?'on':''}" onclick="toggleDashboardMineOnly(false)">All doctors</button>
          <button class="${state.dashboardMineOnly?'on':''}" onclick="toggleDashboardMineOnly(true)">My patients</button>
        </div>` : ''}
      </div>
      ${shownTodaysVisits.length ? rows
        : `<div style="padding:0 4px;">${emptyState('📋', myVisitsOnly ? 'No visits of yours recorded yet today' : 'No visits recorded yet today',
            myVisitsOnly ? 'Visits you attend today will show up here.' : 'Once a patient is checked in and seen, their visit appears here.',
            `<button class="btn btn-accent btn-sm" onclick="go('newVisit')">+ New visit</button>`)}</div>`}
    </div>`;

  const unfinished = unfinishedTodayList();
  const unfinishedRows = unfinished.slice(0,16).map(({p,v,waiting,noDx})=>`
    <div class="dbx-qrow dbx-clickable" onclick="${can('clinicalVisit')?`startTokenConsult('${p.id}','${v.id}')`:`go('patient',{patientId:'${p.id}'})`}">
      <div class="dbx-qtoken">${v.token!=null?'#'+v.token:''}</div>
      <div class="dbx-qtext">
        <div class="dbx-qname">${esc(p.name)}</div>
        <div class="dbx-qsub">${waiting?'Still waiting':''}${waiting&&noDx?' · ':''}${noDx?'No diagnosis yet':''}</div>
      </div>
      <button class="dbx-qbtn" onclick="event.stopPropagation();${can('clinicalVisit')?`startTokenConsult('${p.id}','${v.id}')`:`go('visitPrint',{patientId:'${p.id}',visitId:'${v.id}'})`}">Open</button>
    </div>`).join('');
  const unfinishedCard = `
    <div class="dbx-panel">
      <div class="dbx-panel-head"><h2>Today’s unfinished${unfinished.length?` <span class="count">${unfinished.length}</span>`:''}</h2></div>
      ${unfinished.length ? unfinishedRows : `<div style="padding:0 4px;">${emptyState('✅','All of today’s visits look complete','Waiting or undiagnosed visits appear here until you close them.')}</div>`}
    </div>`;
  const lows = lowStockItems();
  const lowRows = lows.slice(0,12).map(s=>`
    <div class="dbx-qrow dbx-clickable" onclick="go('stock')">
      <div class="dbx-qtext"><div class="dbx-qname">${esc(s.name)}</div>
      <div class="dbx-qsub">${esc(s.quantity)} ${esc(s.unit)||''} · alert at ${esc(s.lowAt)}</div></div>
      <span class="dbx-qstatus wait">Low</span>
    </div>`).join('');
  const lowStockCard = can('stock') ? `
    <div class="dbx-panel">
      <div class="dbx-panel-head"><h2>Low stock${lows.length?` <span class="count">${lows.length}</span>`:''}</h2>
        <button class="link" onclick="go('stock')">Open stock</button></div>
      ${lows.length ? lowRows : `<div style="padding:0 4px;">${emptyState('📦','Stock levels look fine','Items at or below their alert quantity show up here.')}</div>`}
    </div>` : '';

  const panelMap = {
    cash: cashStripHTML(),
    queue: queueSection,
    stats: statsGrid,
    todayVisits: todayVisitsPanel,
    followups: followUpCard,
    reminders: apptRemindCard,
    vaccines: can('pediatrics') ? pedDueCard : '',
    unfinished: unfinishedCard,
    lowstock: lowStockCard,
    quick: quickActionsCard
  };
  const prefs = getDashboardPrefs();
  const orderedPanels = prefs.order.map(id => dashPanelWrap(id, panelMap[id]||'')).join('');

  const customizeBar = `
    <div class="dash-customize-bar">
      <strong>${state.dashboardCustomize ? 'Customize mode — show/hide and reorder panels' : 'Dashboard'}</strong>
      <button class="btn btn-sm ${state.dashboardCustomize?'btn-primary':''}" onclick="toggleDashboardCustomize()">${state.dashboardCustomize?'Done':'Customize'}</button>
    </div>`;

  return `
    ${backupNudgeHTML()}
    ${hero}
    ${ctaRow}
    ${longWaitCard||''}
    ${customizeBar}
    ${orderedPanels}`;
}

function toggleDashboardMineOnly(v){ state.dashboardMineOnly = v; render(); }
async function markFollowUpDone(patientId, visitId){
  const p = state.data.patients.find(p=>p.id===patientId);
  const v = p && (p.visits||[]).find(v=>v.id===visitId);
  if(!v) return;
  v.followUpDate = '';
  await saveData();
  render();
}

function patientsTableHTML(){
  const list = filteredPatients();
  if(list.length===0){
    const hasSearch = (state.search||'').trim().length>0;
    return hasSearch
      ? emptyState('🔍', 'No patients match your search', 'Try a different name, ID or phone number.',
          `<button class="btn btn-sm" onclick="state.search='';render()">Clear search</button>`)
      : emptyState('🗂️', 'No patients registered yet', 'Register your first patient to start building records.',
          `<button class="btn btn-accent btn-sm" onclick="go('newPatient')">+ New Patient</button>`);
  }
  const rows = list.map(p=>{
    const lv = lastVisitDate(p);
    return `<tr class="clickable" onclick="go('patient',{patientId:'${p.id}'})">
      <td><span class="pill">${p.id}</span></td>
      <td>${esc(p.name)}${isPediatricPatient(p)?' <span class="pill" title="Under 16">Ped</span>':''}</td>
      <td>${esc(displayAge(p))} / ${esc(p.sex)}</td>
      <td>${esc(p.phone)||'<span class="faint">—</span>'}</td>
      <td>${lv?fmtDate(lv):'<span class="faint">No visits</span>'}</td>
    </tr>`;
  }).join('');
  return `<table><thead><tr><th>ID</th><th>Name</th><th>Age/Sex</th><th>Phone</th><th>Last visit</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function patientsView(){
  return `
    <div class="page-head">
      <div><h1>Patients</h1><p class="muted">${state.data.patients.length} registered</p></div>
      <div class="row">
        ${can('mergePatients') ? `<button class="btn btn-ghost" onclick="go('mergePatients')">🔗 Merge duplicates</button>` : ''}
        <button class="btn btn-accent" onclick="go('newPatient')">+ New Patient</button>
      </div>
    </div>
    <div class="card">
      <div class="search-wrap" style="margin-bottom:14px;">
        <input type="text" placeholder="Search by name, ID or phone" value="${esc(state.search)}" oninput="onPatientSearchInput(this.value)">
      </div>
      <div id="patients-table-container">${patientsTableHTML()}</div>
    </div>`;
}

/* ============================= MERGE PATIENTS ============================= */
function initMergeUI(){
  state.mergeUI = { aId: null, bId: null, searchA: '', searchB: '', choices: {} };
}
function mergeSearchResultsHTML(side){
  const mu = state.mergeUI;
  const q = (side==='A' ? mu.searchA : mu.searchB).trim().toLowerCase();
  if(!q) return '';
  const excludeId = side==='A' ? mu.bId : mu.aId;
  const matches = state.data.patients.filter(p=>
    p.id!==excludeId && (p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || (p.phone||'').includes(q))
  ).slice(0,6);
  if(!matches.length) return `<p class="faint">No matches.</p>`;
  return matches.map(p=>
    `<div class="chip" style="display:block;width:fit-content;margin-bottom:4px;" onmousedown="selectMergePatient('${side}','${p.id}')">${esc(p.name)} — ${p.id}${p.phone?(' · '+esc(p.phone)):''}</div>`
  ).join('');
}
function onMergeSearchInput(side, v){
  if(side==='A') state.mergeUI.searchA = v; else state.mergeUI.searchB = v;
  const el = document.getElementById('merge-results-'+side);
  if(el) el.innerHTML = mergeSearchResultsHTML(side);
}
function selectMergePatient(side, id){
  if(side==='A') state.mergeUI.aId = id; else state.mergeUI.bId = id;
  state.mergeUI.choices = {}; // field picks reset whenever either side changes
  render();
}
function clearMergeSlot(side){
  if(side==='A') state.mergeUI.aId = null; else state.mergeUI.bId = null;
  render();
}
function mergeFieldRow(field, label, valA, valB){
  const choice = state.mergeUI.choices[field] || 'A';
  return `
    <div class="row" style="align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 0;margin:0;">
      <div style="width:110px;flex:none;"><strong style="font-size:12.5px;">${esc(label)}</strong></div>
      <label style="flex:1;display:flex;gap:6px;align-items:flex-start;cursor:pointer;">
        <input type="radio" name="mf-${field}" ${choice==='A'?'checked':''} onchange="state.mergeUI.choices['${field}']='A'">
        <span>${esc(valA) || '<span class="faint">—</span>'}</span>
      </label>
      <label style="flex:1;display:flex;gap:6px;align-items:flex-start;cursor:pointer;">
        <input type="radio" name="mf-${field}" ${choice==='B'?'checked':''} onchange="state.mergeUI.choices['${field}']='B'">
        <span>${esc(valB) || '<span class="faint">—</span>'}</span>
      </label>
    </div>`;
}
function mergeCompareHTML(a,b){
  const totalVisits = (a.visits||[]).length + (b.visits||[]).length;
  return `
    <div class="card" style="margin-top:16px;max-width:680px;">
      <h2 style="margin-bottom:4px;">Pick which details to keep</h2>
      <p class="faint" style="margin-bottom:10px;">Visit history, growth records and vaccinations from both records are combined either way — only these demographic fields need picking.</p>
      <div class="row" style="padding:0 0 6px;border-bottom:2px solid var(--line);font-weight:600;font-size:12px;color:var(--ink-soft);margin:0;">
        <div style="width:110px;flex:none;"></div>
        <div style="flex:1;">${esc(a.name)} (${a.id})</div>
        <div style="flex:1;">${esc(b.name)} (${b.id})</div>
      </div>
      ${mergeFieldRow('name','Name', a.name, b.name)}
      ${mergeFieldRow('dob','Date of birth', a.dob?fmtDate(a.dob):'', b.dob?fmtDate(b.dob):'')}
      ${mergeFieldRow('age','Age (if DOB unknown)', a.age, b.age)}
      ${mergeFieldRow('sex','Sex', a.sex, b.sex)}
      ${mergeFieldRow('phone','Phone', a.phone, b.phone)}
      ${mergeFieldRow('address','Address', a.address, b.address)}
      ${mergeFieldRow('allergies','Allergies', a.allergies, b.allergies)}
      <p class="muted" style="margin-top:12px;">${totalVisits} visit(s) total will end up on the kept record. "${esc(b.name)}" (${b.id}) will be permanently deleted after merging.</p>
      <div id="merge-error" class="error-text"></div>
      <button class="btn btn-primary" onclick="performMerge()">Merge these records</button>
    </div>`;
}
function mergePatientsView(){
  if(!can('mergePatients')){
    return accessDeniedHTML('Merge patients', 'Merging records is limited to authorised clinical staff.');
  }
  if(!state.mergeUI) initMergeUI();
  const mu = state.mergeUI;
  const a = mu.aId ? state.data.patients.find(p=>p.id===mu.aId) : null;
  const b = mu.bId ? state.data.patients.find(p=>p.id===mu.bId) : null;

  const pickerBlock = (side, p) => p
    ? `<div class="banner banner-info">${esc(p.name)} (${p.id}) — ${esc(displayAge(p))}/${esc(p.sex)} · ${(p.visits||[]).length} visit(s)
        <button class="btn btn-ghost btn-sm" style="margin-left:8px;" onclick="clearMergeSlot('${side}')">Change</button></div>`
    : `<input type="text" placeholder="Search by name, ID or phone" value="${esc(side==='A'?mu.searchA:mu.searchB)}" oninput="onMergeSearchInput('${side}',this.value)">
       <div id="merge-results-${side}" style="margin-top:6px;">${mergeSearchResultsHTML(side)}</div>`;

  let content = `
    <div class="row" style="align-items:flex-start;gap:16px;">
      <div class="card" style="flex:1;min-width:240px;">
        <h3>Record to keep</h3>
        ${pickerBlock('A', a)}
      </div>
      <div class="card" style="flex:1;min-width:240px;">
        <h3>Record to merge in <span class="faint">(will be deleted)</span></h3>
        ${pickerBlock('B', b)}
      </div>
    </div>`;

  if(a && b){
    content += (a.id===b.id)
      ? `<p class="error-text" style="margin-top:14px;">That's the same record on both sides — choose a different patient to merge in.</p>`
      : mergeCompareHTML(a,b);
  }

  return `<div class="page-head"><h1>Merge duplicate patients</h1></div>${content}`;
}
async function performMerge(){
  const mu = state.mergeUI;
  const a = state.data.patients.find(p=>p.id===mu.aId);
  const b = state.data.patients.find(p=>p.id===mu.bId);
  const errEl = document.getElementById('merge-error');
  if(!a || !b) return;
  const typed = prompt(`This combines "${b.name}" (${b.id}) into "${a.name}" (${a.id}) and permanently deletes the "${b.name}" (${b.id}) record.\n\nType MERGE to confirm.`);
  if(typed === null) return;
  if(typed.trim().toUpperCase() !== 'MERGE'){ if(errEl) errEl.textContent = 'Not confirmed — nothing was merged.'; return; }

  const pick = field => (mu.choices[field]||'A')==='A' ? a[field] : b[field];
  a.name = pick('name'); a.dob = pick('dob'); a.age = pick('age'); a.sex = pick('sex');
  a.phone = pick('phone'); a.address = pick('address'); a.allergies = pick('allergies');

  a.visits = (a.visits||[]).concat(b.visits||[]).sort((x,y)=> (x.date+x.id).localeCompare(y.date+y.id));
  a.growthRecords = (a.growthRecords||[]).concat(b.growthRecords||[]);
  a.vaccinations = (a.vaccinations||[]).concat(b.vaccinations||[]);

  (state.data.appointments||[]).forEach(appt=>{ if(appt.patientId===b.id) appt.patientId = a.id; });

  state.data.patients = state.data.patients.filter(p=>p.id!==b.id);
  logAudit('Merged patient records', `${b.name} (${b.id}) merged into ${a.name} (${a.id})`);
  const ok = await saveData();
  if(!ok){ if(errEl) errEl.textContent = state.saveError || 'Could not save — try again.'; return; }
  state.mergeUI = null;
  go('patient', {patientId: a.id});
}

// Aadhaar (and similar ID numbers) are shown masked everywhere except the
// edit form, where the full value is needed to correct typos.
function maskAadhaar(a){
  const digits = (a||'').replace(/\D/g,'');
  if(!digits) return '';
  const last4 = digits.slice(-4);
  return 'XXXX XXXX ' + last4;
}


function patientProblemList(p){
  const seen = new Set();
  const list = [];
  (p.visits||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(v=>{
    const dx = (v.diagnosis||'').trim();
    if(!dx) return;
    const key = dx.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    list.push({diagnosis: dx, date: v.date, visitId: v.id});
  });
  return list;
}
function patientMedicationHistory(p, limit){
  const meds = [];
  (p.visits||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(v=>{
    (v.prescriptions||[]).forEach(rx=>{
      if(!rx.medicine) return;
      meds.push({date: v.date, medicine: rx.medicine, dosage: rx.dosage, frequency: rx.frequency, duration: rx.duration, visitId: v.id});
    });
  });
  return meds.slice(0, limit||20);
}
function patientBmiTrendSVG(p){
  const points = [];
  (p.visits||[]).forEach(v=>{
    const w = parseFloat(v.vitals && v.vitals.weight);
    const h = parseFloat(v.vitals && v.vitals.height);
    if(!w || !h || h<=0) return;
    const bmi = Math.round((w/((h/100)*(h/100)))*10)/10;
    if(v.date) points.push({date:v.date, bmi});
  });
  points.sort((a,b)=>a.date.localeCompare(b.date));
  if(points.length < 2) return points.length===1 ? `<p class="faint">One BMI recorded (${points[0].bmi}) on ${fmtDate(points[0].date)}.</p>` : '';
  const W=400,H=120,pl=28,pr=8,pt=12,pb=24;
  const minB=Math.min(...points.map(x=>x.bmi))-1;
  const maxB=Math.max(...points.map(x=>x.bmi))+1;
  const span=Math.max(0.5, maxB-minB);
  const coords = points.map((p,i)=>{
    const x = pl + (i/(points.length-1))*(W-pl-pr);
    const y = pt + (1-((p.bmi-minB)/span))*(H-pt-pb);
    return {x,y,...p};
  });
  const line = coords.map((c,i)=>(i?'L':'M')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="#2A6B8A"/>`).join('');
  const labels = coords.map(c=>`<text x="${c.x.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">${fmtDate(c.date).split(' ').slice(0,2).join(' ')}</text>`).join('');
  return `<svg class="bmi-spark" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <text x="2" y="${pt+4}" font-size="9" fill="currentColor" opacity="0.5">${maxB.toFixed(0)}</text>
    <text x="2" y="${H-pb}" font-size="9" fill="currentColor" opacity="0.5">${minB.toFixed(0)}</text>
    <path d="${line}" fill="none" stroke="#2A6B8A" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

async function deleteVisit(patientId, visitId){
  if(!can('deleteVisit')) return;
  const p = state.data.patients.find(p=>p.id===patientId);
  const v = p && (p.visits||[]).find(v=>v.id===visitId);
  if(!p || !v) return;
  const warn = v.billing && v.billing.paid ? '\n\nThis visit has a paid bill on record — deleting it also removes that billing history.' : '';
  if(!confirm(`Delete the visit from ${fmtDate(v.date)}? This cannot be undone.${warn}`)) return;
  p.visits = p.visits.filter(v=>v.id!==visitId);
  logAudit('Deleted visit', `${p.name} (${p.id}) — ${fmtDate(v.date)}`);
  await saveData();
  render();
}
async function deletePatient(patientId){
  if(!isOwner() && !can('clinicalVisit')) return;
  const p = state.data.patients.find(p=>p.id===patientId);
  if(!p) return;
  const typed = prompt(`Move ${p.name} (${p.id}) to the recycle bin for 30 days?\nType the patient ID (${p.id}) to confirm.`);
  if(typed === null) return;
  if(typed.trim() !== p.id){ alert('That did not match — nothing was deleted.'); return; }
  if(!state.data.deletedPatients) state.data.deletedPatients = [];
  state.data.deletedPatients.push({patient: JSON.parse(JSON.stringify(p)), deletedAt: new Date().toISOString(), deletedBy: state.session.staffName||''});
  if(state.data.deletedPatients.length > 100) state.data.deletedPatients = state.data.deletedPatients.slice(-100);
  state.data.patients = state.data.patients.filter(pt=>pt.id!==patientId);
  logAudit('Soft-deleted patient', `${p.name} (${p.id})`);
  await saveData();
  go('patients');
}
async function restoreDeletedPatient(idx){
  const entry = (state.data.deletedPatients||[])[idx];
  if(!entry||!entry.patient) return;
  if(state.data.patients.some(x=>x.id===entry.patient.id)){ alert('Patient ID already exists.'); return; }
  state.data.patients.push(entry.patient);
  state.data.deletedPatients.splice(idx,1);
  logAudit('Restored patient', `${entry.patient.name} (${entry.patient.id})`);
  await saveData(); render();
}
async function permanentlyDeletePatient(idx){
  if(!isOwner()){ alert('Only admin can permanently delete.'); return; }
  const entry = (state.data.deletedPatients||[])[idx];
  if(!entry) return;
  if(!confirm('Permanently delete '+entry.patient.name+'? Cannot be undone.')) return;
  logAudit('Permanently deleted', `${entry.patient.name} (${entry.patient.id})`);
  state.data.deletedPatients.splice(idx,1);
  await saveData(); render();
}
// A lighter option than deletePatient(): clears just the personal/contact
// fields (name, DOB/age, phone, address) while keeping the patient ID,
// visit history, prescriptions and billing intact — e.g. for a privacy
// request where the clinic still needs the clinical/financial record.
// Only this one patient is touched; nothing else on the site is affected.
async function clearPatientDetails(patientId){
  if(!isOwner() && !can('clinicalVisit')) return;
  const p = state.data.patients.find(p=>p.id===patientId);
  if(!p) return;
  const originalName = p.name;
  const typed = prompt(`This clears ${p.name}'s name, date of birth/age, phone, address, emergency contact and Aadhaar number — their visit history, prescriptions and billing stay on record under patient ID ${p.id}.\n\nType the patient ID (${p.id}) to confirm.`);
  if(typed === null) return;
  if(typed.trim() !== p.id){ alert('That did not match — nothing was changed.'); return; }
  p.name = '[Details removed]';
  p.dob = ''; p.age = ''; p.phone = ''; p.address = '';
  p.emergencyContactName = ''; p.emergencyContactPhone = ''; p.aadhaar = '';
  p.detailsRedacted = true;
  p.redactedAt = new Date().toISOString();
  logAudit('Cleared patient details', `${p.id} — was "${originalName}"`);
  await saveData();
  render();
}

function recentDeviceActivity(){
  const cutoff = Date.now() - 14*24*60*60*1000;
  const map = {};
  (state.data.auditLog||[]).forEach(e=>{
    const ts = e.ts ? new Date(e.ts).getTime() : 0;
    if(ts < cutoff) return;
    const dev = (e.device||'').trim() || '(unnamed device)';
    const key = dev + '|' + (e.staff||'');
    if(!map[key] || ts > map[key].lastTs){
      map[key] = {device: dev, staff: e.staff||'—', lastTs: ts, lastAction: e.action||'', count: (map[key]?map[key].count:0)+1};
    } else {
      map[key].count++;
    }
  });
  return Object.values(map).sort((a,b)=>b.lastTs-a.lastTs);
}

  const rows = recentDeviceActivity().map(d=>{

    </tr>`;
  }).join('') || '<tr><td colspan="4" class="faint">No recent device activity in the audit log. Name this device below, then use the app — activity will appear here.</td></tr>';
