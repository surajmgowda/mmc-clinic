<style>
  :root{
    /* Refined clinical theme — deep navy, soft teal, warm amber */
    --bg:#F3F6F9;
    --surface:#FFFFFF;
    --ink:#152033;
    --ink-soft:#5A6578;
    --ink-faint:#8A94A6;
    --primary:#1B4F6E;
    --primary-dark:#132038;
    --primary-mid:#2A6F8F;
    --primary-tint:#E7F2F7;
    --primary-tint-strong:#D0E6F0;
    --accent:#C99412;
    --accent-dark:#A67A0C;
    --accent-tint:#FBF4E0;
    --teal:#249688;
    --teal-tint:#E5F5F3;
    --line:#E1E7EF;
    --line-strong:#C5CEDA;
    --danger:#C03D32;
    --danger-tint:#F8EBE9;
    --radius:11px;
    --radius-sm:8px;
    --radius-lg:16px;
    --sidebar-w:252px;
    --shadow-xs:0 1px 2px rgba(19,32,56,0.04);
    --shadow-sm:0 1px 3px rgba(19,32,56,0.06), 0 1px 2px rgba(19,32,56,0.04);
    --shadow-md:0 6px 18px rgba(19,32,56,0.08), 0 2px 4px rgba(19,32,56,0.04);
    --shadow-lg:0 16px 40px rgba(19,32,56,0.12), 0 4px 12px rgba(19,32,56,0.05);
    --transition:150ms ease;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0 0 4px 0;color:var(--primary-dark);}
  h1{font-size:24px;letter-spacing:-0.01em;}
  h2{font-size:18px;}
  h3{font-size:15px;}
  p{margin:0 0 10px 0;}
  a{color:var(--primary-mid);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.01em;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);color:var(--ink);transition:border-color var(--transition),box-shadow var(--transition);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field select + input{margin-top:6px;}
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--primary-mid);box-shadow:0 0 0 3px rgba(42,111,143,0.12);outline:none;
  }
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:130px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 15px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;
    transition:background var(--transition),border-color var(--transition),box-shadow var(--transition),transform 80ms ease;
  }
  .btn:hover{border-color:var(--line-strong);background:#FAFBFC;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 1px 3px rgba(27,79,110,0.28);}
  .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;}
  .btn-accent{background:linear-gradient(135deg, #D4A017 0%, #E0B52A 100%);border-color:var(--accent);color:#1C2333;box-shadow:0 2px 6px rgba(201,148,18,0.28);}
  .btn-accent:hover{filter:brightness(1.03);}
  .btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-tint);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--primary-tint);color:var(--primary-dark);}
  .btn-sm{padding:5px 11px;font-size:12.5px;border-radius:var(--radius-sm);}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;transform:none;}
  .btn-block{width:100%;justify-content:center;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow-sm);}
  .card + .card{margin-top:0;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);font-size:12.5px;}
  .error-text{color:var(--danger);font-size:13px;margin:6px 0;}
  .banner{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;}
  .banner-error{background:var(--danger-tint);color:var(--danger);}
  .banner-info{background:var(--primary-tint);color:var(--primary-dark);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(243,246,249,0.6);}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:rgba(243,246,249,0.35);}
  tr.clickable:hover{background:var(--primary-tint);cursor:pointer;}
  html.dark th{background:rgba(0,0,0,0.15);}
  html.dark tbody tr:nth-child(even){background:rgba(0,0,0,0.12);}

  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--primary-tint);color:var(--primary-dark);}

  /* ---- Empty states ---- */
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px 16px;gap:6px;}
  .empty-state .empty-icon{font-size:26px;line-height:1;margin-bottom:6px;opacity:0.85;}
  .empty-state .empty-title{font-weight:600;color:var(--ink);font-size:14px;}
  .empty-state .empty-sub{color:var(--ink-faint);font-size:12.5px;max-width:360px;}
  .empty-state .empty-action{margin-top:10px;}

  html.dark{
    --bg:#0F1419;--surface:#1A2332;--ink:#E8ECF2;--ink-soft:#A8B5C7;--ink-faint:#6B7A90;
    --primary:#3D8AB0;--primary-dark:#7EB8D4;--primary-mid:#4A9BC4;
    --primary-tint:#1E2A3A;--primary-tint-strong:#243447;
    --accent:#E0B52A;--accent-dark:#F0C94A;--accent-tint:#2A2518;
    --teal:#3DB8A8;--teal-tint:#1A2E2C;--line:#2A3548;--line-strong:#3A4A60;
    --danger:#E85A4F;--danger-tint:#2A1A18;
  }
  html.dark body{background:var(--bg);color:var(--ink);}
  html.dark input,html.dark select,html.dark textarea{background:#121820;color:var(--ink);border-color:var(--line);}
  html.dark .card,html.dark .stat-card,html.dark .dbx-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden;}
  html.dark .print-sheet,html.dark .opdx-card{background:#fff !important;color:#1C2333 !important;}
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .week-day{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:110px;background:var(--surface);}
  .week-day.today{border-color:var(--primary);}
  .week-day-head{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .week-slot{font-size:12px;padding:4px 6px;border-radius:6px;background:var(--primary-tint);margin-bottom:4px;cursor:pointer;}
  .bmi-spark{display:block;width:100%;max-width:420px;height:auto;}

  /* ---- Visit form sections ---- */
  .visit-section{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-xs);
  }
  .visit-section-title{
    font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;
    color:var(--primary-mid);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .visit-sticky-bar{
    position:sticky;bottom:0;z-index:8;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    padding:12px 16px;margin:18px -8px -8px;background:rgba(255,255,255,0.92);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 var(--radius-lg) var(--radius-lg);
    box-shadow:0 -6px 20px rgba(19,32,56,0.06);
  }
  html.dark .visit-sticky-bar{background:rgba(26,35,50,0.94);}
  .clinical-summary{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;
  }
  @media (max-width:700px){ .clinical-summary{grid-template-columns:1fr;} }
  .clinical-summary .cs-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:14px 16px;box-shadow:var(--shadow-xs);
  }
  .clinical-summary .cs-card h3{font-size:12px;font-family:inherit;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .settings-section{margin-bottom:18px;}
  .settings-section > h2{font-size:15px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}

  /* ---- Mobile shell: top bar + drawer + bottom nav ---- */
  .mobile-topbar{display:none;align-items:center;gap:10px;padding:10px 14px;
    background:linear-gradient(175deg,#1A2744,#132038);color:#fff;position:sticky;top:0;z-index:40;}
  .mobile-topbar .mt-brand{font-family:'Source Serif 4',serif;font-weight:700;font-size:16px;flex:1;}
  .mobile-topbar button{background:rgba(255,255,255,0.12);border:none;color:#fff;width:42px;height:42px;
    border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .mobile-topbar button svg{width:20px;height:20px;}
  .mobile-drawer-backdrop{display:none !important;position:fixed;inset:0;background:rgba(15,26,46,0.5);z-index:50;}
  .mobile-drawer{
    display:none !important;
    position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);
    background:linear-gradient(175deg,#1A2744,#0F1A2E);color:#E8ECF2;z-index:60;
    padding:18px 14px 24px;overflow-y:auto;flex-direction:column;
  }
  .mobile-drawer .nav-sec-lbl{display:block !important;margin-top:14px;}
  .mobile-drawer .nav{flex-direction:column !important;width:100%;gap:2px;}
  .mobile-drawer .nav-item{width:100% !important;white-space:nowrap;}
  .mobile-drawer .nav-item span{max-width:none !important;overflow:visible !important;}
  .mobile-bottom-nav{
    display:none;position:fixed;bottom:0;left:0;right:0;z-index:35;
    background:rgba(255,255,255,0.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;align-items:flex-end;
  }
  html.dark .mobile-bottom-nav{background:rgba(26,35,50,0.96);}
  .mobile-bottom-nav button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:none;color:var(--ink-soft);font-size:10.5px;font-weight:600;
    padding:6px 2px;cursor:pointer;min-width:0;
  }
  .mobile-bottom-nav button svg{width:18px;height:18px;}
  .mobile-bottom-nav .mbn-active{color:var(--primary);}
  .mobile-bottom-nav .mbn-fab{
    width:54px;height:54px;border-radius:50%;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;margin-top:-22px;
    box-shadow:0 4px 14px rgba(36,150,136,0.4);font-size:24px;font-weight:700;
    border:3px solid var(--bg);flex:0 0 54px;
  }
  .dash-customize-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;margin-bottom:14px;border-radius:12px;
    background:var(--primary-tint);border:1px solid var(--primary-tint-strong);
  }
  .dash-customize-bar strong{font-size:13px;color:var(--primary-dark);}
  .dash-panel-edit{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}

  @media (min-width:821px){

  /* ---- Autosave / draft indicator ---- */
  .draft-indicator{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
    background:var(--teal-tint);color:#1B6E63;font-size:12.5px;font-weight:600;
    border:1px solid rgba(42,157,143,0.25);transition:background var(--transition),color var(--transition);
  }
  .draft-indicator.draft-idle{background:var(--bg);color:var(--ink-faint);border-color:var(--line);font-weight:500;}
  .draft-indicator .draft-dot{
    width:8px;height:8px;border-radius:99px;background:#2A9D8F;flex-shrink:0;
    animation:draft-pulse 1.6s ease-in-out infinite;
  }
  .draft-indicator.draft-idle .draft-dot{background:var(--ink-faint);animation:none;}
  @keyframes draft-pulse{
    0%{box-shadow:0 0 0 0 rgba(42,157,143,0.45);}
    70%{box-shadow:0 0 0 6px rgba(42,157,143,0);}
    100%{box-shadow:0 0 0 0 rgba(42,157,143,0);}
  }
  .draft-indicator-bar{
    position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;
    margin:-4px -2px 12px;padding:2px;
  }

  /* ---- Shell layout ---- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    background:linear-gradient(175deg, #1A2744 0%, #152038 45%, #0F1A2E 100%);
    color:#E8ECF2;padding:22px 14px 18px;display:flex;flex-direction:column;

  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;padding:0 6px;}

  .brand-mark img, .dbx-hero-mark img, .mt-brand img, .auth-brand .brand-mark img{
    width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;
  }
  .brand-mark.has-logo, .dbx-hero-mark.has-logo{
    background:transparent !important;padding:0;overflow:hidden;
  }
  .mt-brand{display:flex;align-items:center;gap:8px;}
  .mt-brand img{width:28px;height:28px;border-radius:8px;object-fit:cover;}

  .brand-mark{
    width:42px;height:42px;border-radius:11px;

  }
  .auth-method-toggle button{

    border-radius:8px;color:var(--ink-soft);cursor:pointer;
  }
  .auth-method-toggle button.on{
    background:var(--surface);color:var(--primary-dark);box-shadow:var(--shadow-sm);
  }
  .auth-link{
    display:block;text-align:center;margin-top:12px;font-size:13px;font-weight:600;
    color:var(--primary-mid);background:none;border:none;cursor:pointer;padding:0;
  }
  .auth-link:hover{text-decoration:underline;}
  .recovery-code-box{
    background:var(--accent-tint);border:1px solid rgba(212,160,23,0.35);border-radius:10px;
    padding:12px 14px;margin:12px 0;font-family:ui-monospace,monospace;font-size:15px;
    font-weight:700;letter-spacing:0.08em;text-align:center;color:var(--primary-dark);
  }
  .brand-text{line-height:1.25;}
  .brand-text .full{font-family:'Source Serif 4',serif;font-size:14px;color:#fff;font-weight:600;}
  .brand-text .sub{font-size:11px;color:#8B9BB0;margin-top:1px;}
  .nav-sec-lbl{font-size:9.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#5E6C86;margin:16px 10px 6px;}
  .nav-sec-lbl:first-of-type{margin-top:2px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#B8C2D4;font-size:13.5px;font-weight:500;
    text-decoration:none;border:none;background:transparent;text-align:left;width:100%;cursor:pointer;
    transition:background var(--transition),color var(--transition);
  }
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:0.8;}
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{
    background:rgba(36,150,136,0.22);color:#fff;font-weight:600;
    box-shadow:inset 3px 0 0 #3DB8A8;
  }
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column;gap:10px;}
  .foot-row{display:flex;align-items:center;gap:9px;padding:0 2px;}
  .staff-avatar{width:30px;height:30px;border-radius:50%;background:rgba(42,157,143,0.22);color:#7FD9CC;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .staff-chip{font-size:12.5px;color:#8B9BB0;min-width:0;}
  .staff-chip strong{color:#F0F3F8;display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .staff-chip span{font-size:11px;color:#8B9BB0;}

  .main{flex:1;min-width:0;padding:28px 36px 40px;max-width:1040px;background:var(--bg);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
  .stat-num{font-family:'Source Serif 4',serif;font-size:30px;color:var(--primary-dark);font-weight:600;line-height:1;}
  .stat-label{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}

  /* ---- Dashboard redesign (v3 — mockup-inspired, site colors) ---- */
  .dbx-hero{
    background:linear-gradient(155deg, #132038 0%, #1A2F4A 48%, #0F1A2E 100%);

    background:rgba(255,255,255,0.97);border-radius:14px;padding:14px 16px;

  .dbx-panel{

  .dbx-stat-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;

  .dbx-stat-icon.teal{background:var(--teal-tint);color:var(--teal);}
  .dbx-stat-icon.navy{background:var(--primary-tint-strong);color:var(--primary-dark);}

  .dbx-stat-label{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

      -webkit-print-color-adjust:exact;print-color-adjust:exact;

  @media print{
    html,body{height:auto !important;overflow:visible !important;background:#fff !important;}
    body *{visibility:hidden !important;}
    .print-sheet:not(.print-active){display:none !important;}
    .print-sheet.print-active,.print-sheet.print-active *{visibility:visible !important;}
    .print-sheet.print-active{
      display:block !important;position:absolute;top:0;left:0;width:100%;
      padding:12px 18px !important;margin:0 !important;border:none !important;
      box-shadow:none !important;border-radius:0 !important;overflow:visible !important;
      max-width:none !important;page-break-after:avoid;page-break-inside:avoid;
    }
    .print-sheet.print-active::before{display:none !important;}
    @page{margin:10mm;}

// Two-letter initials + a stable colour class for the small round avatar
// chips used on the dashboard's patient rows.
function initialsOf(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '•';
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();

function avatarColorClass(name){
  const s = name||'';
  let h = 0;
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return 'dbx-a' + (h%4 + 1);
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');

  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
// Computes age as of today from a YYYY-MM-DD date of birth.
function ageFromDob(dob){
  if(!dob) return null;
  const b = new Date(dob+'T00:00:00');
  if(isNaN(b)) return null;
  const now = new Date();
  if(b > now) return null;
  let years = now.getFullYear() - b.getFullYear();
  let months = now.getMonth() - b.getMonth();
  let days = now.getDate() - b.getDate();
  if(days < 0){
    months--;
    // Borrow the number of days in the calendar month just before "now" —
    // correctly handles 28/29/30/31-day months instead of assuming 30.
    const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if(months < 0){ years--; months += 12; }
  const totalMonths = years*12 + months;
  const totalDays = Math.round((now - b) / (1000*60*60*24));
  const weeks = Math.floor(Math.max(days,0) / 7);
  const remDays = Math.max(days,0) % 7;
  let display;
  if(years >= 2) display = months ? `${years}y ${months}m` : `${years}y`;
  else if(years >= 1) display = months ? `${years}y ${months}m` : `${years}y`;
  else if(totalMonths >= 1) display = weeks ? `${totalMonths}m ${weeks}w` : `${totalMonths}m`;
  else if(totalDays >= 7) display = remDays ? `${weeks}w ${remDays}d` : `${weeks}w`;
  else display = `${Math.max(days,0)}d`;
  return {years, months, days, totalMonths, totalDays, weeks, remDays, display, full: formatAgeYMD(years, months, days)};
}
// OPD card age line — explicit rules from clinic:
// ≥1 year → years + months; <1 year → months + weeks; <1 month → weeks + days.
function opdAgeDisplay(p){
  if(p && p.dob){
    const a = ageFromDob(p.dob);
    if(a){
      if(a.years >= 1){
        return a.months ? `${a.years} year${a.years===1?'':'s'}, ${a.months} month${a.months===1?'':'s'}` : `${a.years} year${a.years===1?'':'s'}`;
      }
      if(a.totalMonths >= 1){
        const w = a.weeks;
        return w ? `${a.totalMonths} month${a.totalMonths===1?'':'s'}, ${w} week${w===1?'':'s'}` : `${a.totalMonths} month${a.totalMonths===1?'':'s'}`;
      }
      const w = Math.floor(a.totalDays / 7);
      const d = a.totalDays % 7;
      if(w >= 1) return d ? `${w} week${w===1?'':'s'}, ${d} day${d===1?'':'s'}` : `${w} week${w===1?'':'s'}`;
      return `${Math.max(a.totalDays,0)} day${a.totalDays===1?'':'s'}`;
    }
  }
  return (p && p.age) || '—';
}

function isPediatricPatient(p){
  if(!p) return false;
  if(p.dob){
    const a = ageFromDob(p.dob);
    if(a) return a.years < 16;
  }
  // Fallback: try to parse free-text age like "5y", "8 years", "10"
  const m = String(p.age||'').match(/(\d+)/);
  if(m) return parseInt(m[1],10) < 16;
  return false;
}
function pediatricPatients(){
  return (state.data.patients||[]).filter(isPediatricPatient)
    .sort((a,b)=> (b.registeredDate||'').localeCompare(a.registeredDate||''));
}
// "23 years, 6 months, and 16 days" — full-precision exact age, e.g. for a
// patient's profile where there's room, vs. the compact `display`/`full`
// pairing above which fits list rows and print sheets.
function formatAgeYMD(years, months, days){
  const parts = [];
  if(years > 0) parts.push(`${years} year${years===1?'':'s'}`);
  if(months > 0) parts.push(`${months} month${months===1?'':'s'}`);
  if(days > 0 || parts.length===0) parts.push(`${days} day${days===1?'':'s'}`);
  if(parts.length === 1) return parts[0];
  if(parts.length === 2) return parts.join(' and ');
  return parts.slice(0,-1).join(', ') + ', and ' + parts[parts.length-1];
}
function updateAgePreview(inputEl, previewId){
  const el = document.getElementById(previewId);
  if(!el) return;
  const a = ageFromDob(inputEl.value);
  el.textContent = a ? `Age: ${a.full}` : '';
}
// Patients registered with a DOB get an always-current age; older records
// that only have the legacy free-text age field fall back to that.
function displayAge(p){
  if(p && p.dob){ const a = ageFromDob(p.dob); if(a) return a.display; }
  return (p && p.age) || '';
}
// Formats chief complaints for the OPD card: each item gets a "C/O " prefix.
// "Fever × 3days, Cough" → "C/O Fever × 3days\nC/O Cough"
function formatComplaintsForOpd(raw){
  if(!raw || !String(raw).trim()) return '—';
  return String(raw).split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).map(s=>{
    // If the doctor already typed c/o (any casing), leave that complaint as-is
    if(/^c\/?o\b/i.test(s)) return s;
    return 'c/o ' + s;
  }).join('\n');
}

// BMI classification:
// Adults (≥16y): Consensus / WHO-Asian cut-offs widely used in India
//   <18.5 Underweight · 18.5–22.9 Normal · 23–24.9 Overweight · ≥25 Obese
// Pediatrics (<16y): IAP-oriented age-band screening (confirm with growth chart)
function calcBMI(weightKg, heightCm, ageYears){
  const w = parseFloat(weightKg), h = parseFloat(heightCm);
  if(!w || !h || h <= 0) return null;
  const m = h / 100;
  const bmi = w / (m * m);
  const value = Math.round(bmi * 10) / 10;
  const age = (ageYears != null && ageYears !== '') ? parseFloat(ageYears) : null;
  const pediatric = age != null && !isNaN(age) && age < 16;

  let label, standard;
  if(pediatric){
    standard = 'Indian pediatric (IAP-oriented)';
    // Approximate age-banded screening thresholds for South Asian children
    let uw, ow, ob;
    if(age < 5){ uw = 14; ow = 17; ob = 19; }
    else if(age < 11){ uw = 14.5; ow = 18; ob = 21; }
    else { uw = 16; ow = 22; ob = 25; } // 11–15y approaches adult Asian cut-offs
    if(bmi < uw) label = 'Underweight';
    else if(bmi < ow) label = 'Normal';
    else if(bmi < ob) label = 'Overweight';
    else label = 'Obese';
  } else {
    standard = 'Indian adult (Asian cut-offs)';
    if(bmi < 18.5) label = 'Underweight';
    else if(bmi < 23) label = 'Normal';
    else if(bmi < 25) label = 'Overweight';
    else if(bmi < 30) label = 'Obese';
    else label = 'Obese (class II)';
  }
  return { value, label, standard, pediatric: !!pediatric };
}
function patientAgeYearsForBmi(p){
  if(!p) return null;
  if(p.dob){
    const a = ageFromDob(p.dob);
    if(a) return a.years + (a.months||0)/12;
  }
  const m = String(p.age||'').match(/(\d+)/);
  return m ? parseInt(m[1],10) : null;
}
function updateBmiPreview(){
  const w = document.getElementById('v-weight');
  const h = document.getElementById('v-height');
  const el = document.getElementById('v-bmi-preview');
  if(!el) return;
  let ageY = null;
  if(state.draftVisit && state.draftVisit.patientId){
    const p = state.data.patients.find(x=>x.id===state.draftVisit.patientId);
    ageY = patientAgeYearsForBmi(p);
  }
  const r = calcBMI(w && w.value, h && h.value, ageY);
  if(!r){ el.textContent = ''; return; }
  el.textContent = `BMI: ${r.value} (${r.label}) · ${r.standard}`;
}

// Token number for waiting-room queue (resets each calendar day)
function nextTokenNumber(){
  const today = todayStr();
  if(state.data.tokenDate !== today){
    state.data.tokenDate = today;
    state.data.nextTokenSeq = 1;
  }
  const n = state.data.nextTokenSeq || 1;
  state.data.nextTokenSeq = n + 1;
  return n;
}
function peekNextTokenNumber(){
  const today = todayStr();
  if(state.data.tokenDate !== today) return 1;
  return state.data.nextTokenSeq || 1;
}
function todayVisitsWithTokens(){
  const today = todayStr();
  const list = [];
  (state.data.patients||[]).forEach(p=>{
    (p.visits||[]).forEach(v=>{
      if(v.date===today && v.token!=null) list.push({patient:p, visit:v});
    });
  });
  list.sort((a,b)=>(a.visit.token||0)-(b.visit.token||0));
  return list;
}
function tokenQueueStatus(v){
  if(!v) return 'waiting';
  if(v.tokenStatus) return v.tokenStatus;
  if(visitStatus(v)==='completed') return 'done';
  return 'waiting';
}
function waitingTokenQueue(){
  return todayVisitsWithTokens().filter(({visit:v})=>{
    const st = tokenQueueStatus(v);
    return st==='waiting' || st==='called';
  });
}
function nowServingEntry(){
  const all = todayVisitsWithTokens();
  const withDoc = all.find(({visit:v})=>tokenQueueStatus(v)==='with_doctor');
  if(withDoc) return withDoc;
  const called = all.find(({visit:v})=>tokenQueueStatus(v)==='called');
  return called || null;
}
function nextWaitingEntry(){
  return waitingTokenQueue().find(({visit:v})=>tokenQueueStatus(v)==='waiting') || null;
}
async function callNextToken(){
  const next = nextWaitingEntry();
  if(!next){ alert('No patients waiting in the token queue.'); return; }
  // Clear previous "called" that never started
  todayVisitsWithTokens().forEach(({visit:v})=>{
    if(tokenQueueStatus(v)==='called') v.tokenStatus = 'waiting';
  });
  next.visit.tokenStatus = 'called';
  next.visit.calledAt = new Date().toISOString();
  logAudit('Called token', `#${next.visit.token} — ${next.patient.name}`);
  await saveData();
  render();
}
async function callSpecificToken(patientId, visitId){
  const p = state.data.patients.find(x=>x.id===patientId);
  const v = p && (p.visits||[]).find(x=>x.id===visitId);
  if(!v) return;
  todayVisitsWithTokens().forEach(({visit:x})=>{
    if(tokenQueueStatus(x)==='called' && x.id!==visitId) x.tokenStatus = 'waiting';
  });
  v.tokenStatus = 'called';
  v.calledAt = new Date().toISOString();
  logAudit('Called token', `#${v.token} — ${p.name}`);
  await saveData();
  render();
}
async function startTokenConsult(patientId, visitId){
  if(!can('clinicalVisit')) return;
  const p = state.data.patients.find(x=>x.id===patientId);
  const v = p && (p.visits||[]).find(x=>x.id===visitId);
  if(!v) return;
  v.tokenStatus = 'with_doctor';
  await saveData();
  go('newVisit', {patientId, editVisitId: visitId});
}
async function openNextConsult(){
  if(!can('clinicalVisit')) return;
  let now = nowServingEntry();
  if(!now || tokenQueueStatus(now.visit)==='done'){
    const nxt = nextWaitingEntry();
    if(!nxt){ alert('No patients waiting.'); return; }
    await callSpecificToken(nxt.patient.id, nxt.visit.id);
    now = nowServingEntry() || nxt;
  }
  await startTokenConsult(now.patient.id, now.visit.id);
}
async function skipToken(patientId, visitId){
  const p = state.data.patients.find(x=>x.id===patientId);
  const v = p && (p.visits||[]).find(x=>x.id===visitId);
  if(!v) return;
  v.tokenStatus = 'waiting';
  v.calledAt = '';
  // Move to end of today's queue by giving a high token? Better: mark skipped and re-call next
  logAudit('Skipped token', `#${v.token} — ${p.name}`);
  await saveData();
  await callNextToken();
}
function tokenBoardHTML(){
  const now = nowServingEntry();
  const next = nextWaitingEntry();
  const waiting = waitingTokenQueue().filter(({visit:v})=>tokenQueueStatus(v)==='waiting');
  return `
    <div class="token-board">
      <div class="token-now">
        <div class="tn-label">Now serving</div>
        <div class="tn-num">${now && now.visit.token!=null ? '#'+now.visit.token : '—'}</div>
        <div class="tn-name">${now ? esc(now.patient.name) : 'No patient called'}</div>
        ${now && tokenQueueStatus(now.visit)==='with_doctor' ? '<div class="tn-name" style="opacity:0.7;font-size:12px;margin-top:4px;">With doctor</div>' : ''}
      </div>
      <div class="token-next">
        <div class="tn-label">Up next</div>
        <div class="tn-num">${next && next.visit.token!=null ? '#'+next.visit.token : '—'}</div>
        <div class="tn-name">${next ? esc(next.patient.name) : 'Queue empty'}</div>
        <div class="tn-name" style="opacity:0.7;font-size:12px;margin-top:4px;">${waiting.length} waiting · next issue #${peekNextTokenNumber()}</div>
      </div>
    </div>
    <div class="token-actions">
      ${can('clinicalVisit') ? `<button class="btn btn-accent" onclick="openNextConsult()">Open next patient</button>` : ''}
      <button class="btn btn-primary btn-sm" onclick="callNextToken()">Call next token</button>
      ${now && can('clinicalVisit') ? `<button class="btn btn-primary" onclick="startTokenConsult('${now.patient.id}','${now.visit.id}')">Open consult — ${esc(now.patient.name)}</button>` : ''}
      ${now ? `<button class="btn btn-ghost btn-sm" onclick="printTokenSlip('${now.patient.id}','${now.visit.id}')">Reprint token</button>` : ''}
      ${(state.data.lastPrinted&&state.data.lastPrinted.patientId) ? `<button class="btn btn-ghost btn-sm" onclick="reprintLast()">Reprint last document</button>` : ''}
    </div>`;
}



/* ============================= STORAGE (server API) ============================= */
let dataVersion = 0;

async function loadData(){
  try{
    const res = await fetch('/api/data', {credentials:'same-origin'});
    if(res.status === 401){
      // Session cookie missing/expired — the server no longer recognizes us,
      // regardless of what the local UI thinks. Back to the login screen.
      state.session.staffName = null;
      await loadStaffListForLogin();
      return;
    }
    if(!res.ok) throw new Error('bad response');
    const json = await res.json();
    state.data = json.data;
    if(!state.data.customMedicines) state.data.customMedicines = [];
    if(!state.data.appointments) state.data.appointments = [];
    if(!state.data.auditLog) state.data.auditLog = [];
    if(!state.data.rxTemplates) state.data.rxTemplates = [];
    if(!state.data.deletedPatients) state.data.deletedPatients = [];
    if(!state.data.expenses) state.data.expenses = [];
    if(!state.data.drugStock) state.data.drugStock = [];
    if(!state.data.dutyRoster) state.data.dutyRoster = [];
    if(!state.data.ancRegister) state.data.ancRegister = [];
    dataVersion = json.version;
    state.loadError = null;
    bootClinicGuards();
    ensureStaffAuthMethods();
  } catch(e){
    state.loadError = 'Could not reach the clinic server. Check your connection and reload the page.';
  }
  state.loading = false;
  render();
}

// Saves state.data to the server. Returns true on success, false if the
// save failed or was superseded by another device's more recent save
// (in which case state.data is refreshed with the server's latest copy).
async function saveData(){
  try{
    const res = await fetch('/api/data', {
      method:'PUT',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({version: dataVersion, data: state.data})
    });
    if(res.status === 401){
      state.saveError = 'Your session has expired — please log in again.';
      state.session.staffName = null;
      render();
      return false;
    }
    if(res.status === 409){
      const server = await res.json();
      state.data = server.data;
      bootClinicGuards();
      dataVersion = server.version;
      state.saveError = 'Records were just updated from another device — showing the latest version. Please redo your last change.';
      return false;
    }
    if(!res.ok){
      state.saveError = 'Could not save. Please try again.';
      return false;
    }
    const json = await res.json();
    dataVersion = json.version;
    state.saveError = null;
    return true;
  } catch(e){
    state.saveError = (typeof navigator!=='undefined' && navigator.onLine===false) ? 'You appear offline — reconnect, then save again. Data was not written to the server.' : 'Could not save — the server may be waking up. Wait 30 seconds and try again.';
    return false;
  }
}

  state.mobileMenuOpen = false;

      existingVisit = p ? (p.visits||[]).find(v=>v.id===state.routeParams.editVisitId) : null;

    initMergeUI();
  }
  render();
}

/* ============================= AUTH ============================= */
// Actual PIN verification now happens server-side (see /api/login in
// server.js) — the server checks the real stored hash and issues a signed
// session cookie; the browser is never trusted to self-certify who it is.
// hashPin() still runs client-side only for the narrow, already-logged-in-
// as-owner cases of setting a NEW pin (addStaff, resetStaffPin) — the
// resulting unsalted hash is transparently upgraded to a salted one
// server-side the first time that staff member actually logs in with it.
async function hashPin(pin){
  return hashSecret(pin);
}
async function hashSecret(value){
  const enc = new TextEncoder().encode(String(value||''));
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function generateRecoveryCode(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  for(let i=0;i<8;i++) out += alphabet[arr[i] % alphabet.length];
  return out.slice(0,4) + '-' + out.slice(4);
}

/* ============================= PIN LOCKOUT ============================= */
// A 4-digit PIN only has 10,000 combinations, so with no limit it's
// guessable quickly. We track wrong attempts per staff name in
// localStorage (survives a page reload, unlike in-memory state) and lock
// that name out for a cooldown once the threshold is hit. The cooldown
// doubles each time it's triggered again, so repeated guessing gets
// slower rather than staying a fixed, plannable delay.
const PIN_LOCK_THRESHOLD = 5;
const PIN_LOCK_BASE_MS = 30 * 1000; // 30s, then 60s, 120s... capped below
const PIN_LOCK_MAX_MS = 15 * 60 * 1000; // cap at 15 minutes
function getPinAttempts(){
  try{ return JSON.parse(localStorage.getItem('mmc_pin_attempts')||'{}'); } catch(e){ return {}; }
}
function savePinAttempts(obj){
  try{ localStorage.setItem('mmc_pin_attempts', JSON.stringify(obj)); } catch(e){ /* storage unavailable */ }
}
function pinLockStatus(name){
  if(!name) return {locked:false};
  const rec = getPinAttempts()[name];
  if(rec && rec.lockedUntil && Date.now() < rec.lockedUntil){
    return {locked:true, remainingMs: rec.lockedUntil - Date.now()};
  }
  return {locked:false};
}
function recordFailedPin(name){
  const all = getPinAttempts();
  const rec = all[name] || {fails:0, lockCount:0};
  rec.fails++;
  if(rec.fails >= PIN_LOCK_THRESHOLD){
    rec.lockCount++;
    rec.lockedUntil = Date.now() + Math.min(PIN_LOCK_BASE_MS * Math.pow(2, rec.lockCount-1), PIN_LOCK_MAX_MS);
    rec.fails = 0;
  }
  all[name] = rec;
  savePinAttempts(all);
  return rec;
}
function clearPinAttempts(name){
  const all = getPinAttempts();
  delete all[name];
  savePinAttempts(all);
}
function staffAuthMethod(name){
  const s = (state.data && state.data.staff || []).find(x=>x.name===name);
  if(!s) return 'pin';
  if(s.authMethod === 'password' || s.authMethod === 'pin') return s.authMethod;
  // Legacy accounts: prefer password if only password hash exists
  if(s.password && !s.pin) return 'password';
  return 'pin';
}
function onLoginStaffChange(name){
  state.loginSelectedName = name;
  state.loginAuthMethod = staffAuthMethod(name);
  const staff = (state.data.staff||[]).find(s=>s.name===name);
  state.loginNeedsTotp = !!(staff && staff.totpEnabled);
  const lock = pinLockStatus(name);
  state.loginError = lock.locked ? `Too many incorrect attempts. Try again in ${Math.ceil(lock.remainingMs/1000)}s.` : '';
  render();
}

async function doSetup(){
  const name = document.getElementById('setup-name').value.trim();
  const role = document.getElementById('setup-role').value;
  const authMethod = (document.getElementById('setup-auth-method')||{}).value === 'password' ? 'password' : 'pin';
  const pin = (document.getElementById('setup-pin')||{}).value.trim() || '';
  const password = (document.getElementById('setup-password')||{}).value || '';
  const password2 = (document.getElementById('setup-password2')||{}).value || '';
  const err = document.getElementById('setup-error');
  if(!name){ err.textContent = 'Enter your name.'; return; }
  if(authMethod === 'pin'){
    if(!/^\d{4}$/.test(pin)){ err.textContent = 'Enter a 4-digit PIN.'; return; }
  } else {
    if(password.length < 6){ err.textContent = 'Password must be at least 6 characters.'; return; }
    if(password !== password2){ err.textContent = 'Passwords do not match.'; return; }
  }
  const recoveryCode = generateRecoveryCode();
  const body = {name, role, authMethod, recoveryCode};
  if(authMethod === 'pin') body.pin = pin; else body.password = password;
  try{
    const res = await fetch('/api/setup', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok){ err.textContent = json.error || 'Could not complete setup — try again.'; return; }
    state.session.staffName = json.name;
    state.loading = true;
    render();
    await loadData();
    handlePatientHashRoute();
    const me = state.data.staff.find(s=>s.name===json.name);
    if(me){
      me.authMethod = authMethod;
      if(authMethod === 'pin'){ me.pin = await hashPin(pin); delete me.password; }
      else { me.password = await hashSecret(password); delete me.pin; }
      me.recoveryHash = await hashSecret(recoveryCode.replace(/-/g,'').toUpperCase());
    }
    logAudit('Clinic set up', `First account: ${json.name} (${json.role}) · ${authMethod}`, json.name);
    await saveData();
    alert('Account created.\n\nWrite down this recovery code — needed if you forget your login:\n\n' + recoveryCode + '\n\nIt will not be shown again.');
  } catch(e){
    err.textContent = 'Could not reach the clinic server. Check your connection and try again.';
  }
}
function onSetupAuthMethodChange(){

// Whoever's logged in — used to gate doctor-only actions like "Continue".
function currentStaffRole(){
  if(!state.data || !state.data.staff) return null; // data hasn't loaded yet (or failed to)
  const s = state.data.staff.find(s=>s.name===state.session.staffName);
  return s ? s.role : null;
}

function isDoctor(){ return currentStaffRole()==='Doctor'; }
// Clinic-wide role permissions. Owner can change these in Settings.
const ROLE_PERM_KEYS = [
  {key:'checkIn', label:'Check in patients'},
  {key:'clinicalVisit', label:'Full OPD visit (vitals, notes, Rx, labs)'},
  {key:'viewClinical', label:'View clinical notes / diagnosis'},
  {key:'deleteVisit', label:'Delete visits'},
  {key:'certificates', label:'Issue medical certificates'},
  {key:'billing', label:'Billing'},
  {key:'reports', label:'Reports'},
  {key:'pediatrics', label:'Pediatrics tools'},
  {key:'recall', label:'Recall register'},
  {key:'anc', label:'ANC register'},
  {key:'expenses', label:'Expenses'},
  {key:'stock', label:'Stock'},
  {key:'roster', label:'Roster'},
  {key:'mergePatients', label:'Merge duplicate patients'}
];
const ROLE_PERM_DEFAULTS = {
  Doctor:       {checkIn:true, clinicalVisit:true, viewClinical:true, deleteVisit:true, certificates:true, billing:true, reports:true, pediatrics:true, recall:true, anc:true, expenses:true, stock:true, roster:true, mergePatients:true},
  Receptionist: {checkIn:true, clinicalVisit:false, viewClinical:false, deleteVisit:false, certificates:false, billing:true, reports:false, pediatrics:false, recall:false, anc:false, expenses:false, stock:false, roster:true, mergePatients:false},
  Staff:        {checkIn:true, clinicalVisit:false, viewClinical:false, deleteVisit:false, certificates:false, billing:false, reports:false, pediatrics:false, recall:false, anc:false, expenses:false, stock:true, roster:true, mergePatients:false}
};
function ensureRolePerms(){
  if(!state.data) return;
  if(!state.data.rolePerms) state.data.rolePerms = {};
  ['Doctor','Receptionist','Staff'].forEach(role=>{
    const cur = state.data.rolePerms[role] || {};
    state.data.rolePerms[role] = Object.assign({}, ROLE_PERM_DEFAULTS[role], cur);
  });
  // One-time privacy lock: reception must not keep clinical flags from older builds
  if(!state.data.rolePerms._privacyLockV1){
    const r = state.data.rolePerms.Receptionist;
    if(r){
      r.clinicalVisit = false;
      r.viewClinical = false;
      r.pediatrics = false;
      r.certificates = false;
      r.deleteVisit = false;
      r.mergePatients = false;
      r.reports = false;
      r.recall = false;
      r.anc = false;
    }
    state.data.rolePerms._privacyLockV1 = true;
  }
}
function can(perm){
  if(isOwner()) return true;
  const role = currentStaffRole();
  if(!role) return false;
  ensureRolePerms();
  const row = state.data.rolePerms[role] || ROLE_PERM_DEFAULTS[role] || {};
  if(perm === 'viewClinical' && (row.viewClinical || row.clinicalVisit)) return true;

// A visit a receptionist saved without a diagnosis yet is "waiting" for a
// doctor to continue it. Older records with no explicit status fall back
// to inferring it from whether a diagnosis was ever recorded.
function visitStatus(v){
  return v.status || (v.diagnosis ? 'completed' : 'waiting');
}

// Older visits (saved before billing existed) get a default here rather
// than being migrated in the database.
function billingOf(v){

function billingTotal(b){
  const fee = parseFloat(b.fee) || 0;
  const chargeSum = (b.charges||[]).reduce((sum,c)=> sum + (parseFloat(c.amount)||0), 0);
  return fee + chargeSum;
}

async function doLogin(){
  if(state.loginInProgress) return;
  const name = document.getElementById('login-select').value;
  const method = staffAuthMethod(name);
  state.loginAuthMethod = method;
  const pinEl = document.getElementById('login-pin');
  const passEl = document.getElementById('login-password');
  const pin = pinEl ? pinEl.value.trim() : '';
  const password = passEl ? passEl.value : '';
  const lock = pinLockStatus(name);
  if(lock.locked){
    state.loginError = `Too many incorrect attempts. Try again in ${Math.ceil(lock.remainingMs/1000)}s.`;
    render();
    return;
  }
  if(method === 'pin' && !/^\d{4}$/.test(pin)){
    state.loginError = 'Enter your 4-digit PIN.';
    render();
    return;
  }
  if(method === 'password' && !password){
    state.loginError = 'Enter your password.';
    render();
    return;
  }
  const totpCode = ((document.getElementById('login-totp')||{}).value||'').replace(/\s/g,'');
  const body = method === 'password' ? {staffName: name, password} : {staffName: name, pin};
  if(totpCode) body.totpCode = totpCode;
  const btn = document.querySelector('.auth-card .btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  state.loginError = '';
  state.loginInProgress = true;
  // Retry a couple of times on network / server wake-up without treating it as a wrong PIN
  const maxAttempts = 3;
  for(let attempt = 1; attempt <= maxAttempts; attempt++){
    try{
      const res = await fetch('/api/login', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      if(res.ok){
        clearPinAttempts(name);
        const json = await res.json();
        state.session.staffName = json.name;
        state.loginError = '';
        state.loginMode = 'login';
        state.loginInProgress = false;
        state.loading = true;
        render();
        await loadData();
        logAudit('Login', 'Signed in' + (deviceLabel() ? ' · '+deviceLabel() : ''));
        handlePatientHashRoute();
        return;
      }
      // Real wrong credentials (401/403, and 400 which some servers use for bad PIN)
      if(res.status === 401 || res.status === 403 || res.status === 400){
        const json = await res.json().catch(()=>({}));
        if(json.error === 'totp_required'){
          state.loginNeedsTotp = true;
          state.loginError = 'Enter the 6-digit code from your authenticator app.';
          state.loginInProgress = false;
          render();
          const totpEl = document.getElementById('login-totp');
          if(totpEl) totpEl.focus();
          return;
        }
        if(json.error === 'invalid_totp'){
          state.loginNeedsTotp = true;
          state.loginError = 'Incorrect authenticator code. Try again.';
          state.loginInProgress = false;
          render();
          return;
        }
        const rec = recordFailedPin(name);
        if(rec.lockedUntil && Date.now() < rec.lockedUntil){
          state.loginError = `Too many incorrect attempts. Try again in ${Math.ceil((rec.lockedUntil-Date.now())/1000)}s.`;
        } else {
          const left = PIN_LOCK_THRESHOLD - rec.fails;
          const what = method === 'password' ? 'password' : 'PIN';
          state.loginError = `Incorrect ${what}. Try again.${left<=2 ? ` (${left} attempt${left===1?'':'s'} left before a cooldown)` : ''}`;
        }
        state.loginInProgress = false;
        render();
        return;
      }
      if(res.status === 429){
        const json = await res.json().catch(()=>({}));
        state.loginError = `Too many incorrect attempts. Try again in ${Math.ceil((json.remainingMs||30000)/1000)}s.`;
        state.loginInProgress = false;
        render();
        return;
      }
      // 5xx / other: server issue, not wrong PIN — retry
      if(attempt < maxAttempts){
        state.loginError = 'Server is waking up… retrying (' + attempt + '/' + maxAttempts + ')';
        render();
        const btn2 = document.querySelector('.auth-card .btn-primary');
        if(btn2){ btn2.disabled = true; btn2.textContent = 'Signing in…'; }
        await new Promise(r=>setTimeout(r, 1500 * attempt));
        continue;
      }
      state.loginError = 'Could not reach the clinic server (HTTP ' + res.status + '). Wait a moment and try again — this is not a wrong PIN.';
      state.loginInProgress = false;
      render();
      return;
    } catch(e){
      if(attempt < maxAttempts){
        state.loginError = 'Connecting… retrying (' + attempt + '/' + maxAttempts + ')';
        render();
        const btn2 = document.querySelector('.auth-card .btn-primary');
        if(btn2){ btn2.disabled = true; btn2.textContent = 'Signing in…'; }
        await new Promise(r=>setTimeout(r, 1500 * attempt));
        continue;
      }
      state.loginError = 'Could not reach the clinic server. Check your connection and try again — this is not a wrong PIN.';
      state.loginInProgress = false;
      render();
      return;
    }
  }
  state.loginInProgress = false;
}

async function doVerifyRecoveryCode(){
  const name = document.getElementById('forgot-select').value;
  const codeRaw = (document.getElementById('forgot-code')||{}).value || '';
  const code = codeRaw.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  const err = document.getElementById('forgot-error');
  if(!name || code.length < 6){
    if(err) err.textContent = 'Select your name and enter the recovery code.';
    return;
  }
  try{
    const res = await fetch('/api/verify-recovery', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({staffName: name, recoveryCode: code})
    });
    if(res.ok){
      const json = await res.json().catch(()=>({}));
      state.pendingRecoveryStaff = name;
      state.pendingRecoveryToken = json.recoveryToken || null;
      state.loginMode = 'reset';
      state.loginError = '';
      render();
      return;
    }
    const staff = (state.data.staff||[]).find(s=>s.name===name);
    if(staff && staff.recoveryHash){
      const h = await hashSecret(code);
      if(h === staff.recoveryHash){
        state.pendingRecoveryStaff = name;
        state.loginMode = 'reset';
        state.loginError = '';
        render();
        return;
      }
    }
    if(err) err.textContent = 'Invalid recovery code. Check the code saved when the account was created, or ask the clinic admin to reset your login from Settings.';
  } catch(e){
    const staff = (state.data.staff||[]).find(s=>s.name===name);
    if(staff && staff.recoveryHash){
      const h = await hashSecret(code);
      if(h === staff.recoveryHash){
        state.pendingRecoveryStaff = name;
        state.loginMode = 'reset';
        state.loginError = '';
        render();
        return;
      }
    }
    if(err) err.textContent = 'Could not verify recovery code. Check your connection, or ask the clinic admin to reset your login from Settings → Staff accounts.';
  }
}

async function doResetCredentials(){
  const name = state.pendingRecoveryStaff;
  if(!name){ cancelForgotAuth(); return; }
  const authMethod = (document.getElementById('reset-auth-method')||{}).value === 'password' ? 'password' : 'pin';
  const pin = ((document.getElementById('reset-pin')||{}).value || '').trim();
  const password = (document.getElementById('reset-password')||{}).value || '';
  const password2 = (document.getElementById('reset-password2')||{}).value || '';
  const err = document.getElementById('reset-error');
  if(authMethod === 'pin'){
    if(!/^\d{4}$/.test(pin)){ if(err) err.textContent = 'Enter a new 4-digit PIN.'; return; }
  } else {
    if(password.length < 6){ if(err) err.textContent = 'Password must be at least 6 characters.'; return; }
    if(password !== password2){ if(err) err.textContent = 'Passwords do not match.'; return; }
  }
  const newRecovery = generateRecoveryCode();
  const body = {
    staffName: name,
    authMethod,
    recoveryToken: state.pendingRecoveryToken || undefined,
    recoveryCode: newRecovery,
    newRecoveryCode: newRecovery
  };
  if(authMethod === 'pin') body.pin = pin; else body.password = password;
  try{
    const res = await fetch('/api/reset-credentials', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(res.ok){
      clearPinAttempts(name);
      const s = (state.data.staff||[]).find(x=>x.name===name);
      if(s){
        s.authMethod = authMethod;
        if(authMethod === 'pin'){ delete s.password; }
        else { delete s.pin; }
      }
      alert('Login updated.\n\nNew recovery code (write it down — shown only once):\n\n' + newRecovery);
      state.loginMode = 'login';
      state.pendingRecoveryStaff = null;
      state.pendingRecoveryToken = null;
      state.loginSelectedName = name;
      state.loginAuthMethod = authMethod;
      state.loginError = 'Login updated. You can sign in now.';
      render();
      return;
    }
    const json = await res.json().catch(()=>({}));
    if(err) err.textContent = json.error || 'Could not reset credentials. Ask the clinic admin to reset your login from Settings.';
  } catch(e){
    if(err) err.textContent = 'Could not reach the clinic server. Ask the clinic admin to reset your login from Settings → Staff accounts.';
  }
}

/* ============================= SESSION VERIFICATION ============================= */
// "Logged in" is now whatever the server's signed session cookie says, not
// anything read out of browser storage — that was the actual hole (a
// staff name sitting in sessionStorage proved nothing to the server, which
// had no server-side concept of sessions at all). On boot, ask the server;
// its answer is authoritative.
async function initSession(){
  try{
    const res = await fetch('/api/session', {credentials:'same-origin'});
    if(res.ok){
      const json = await res.json();
      state.session.staffName = json.name;
      await loadData();
      handlePatientHashRoute();
      return;
    }
  } catch(e){ /* fall through to the logged-out path below */ }
  state.session.staffName = null;
  await loadStaffListForLogin();
}
// Not logged in yet — fetch just enough (staff names + roles, no PINs, no
// patient data) to render the login or first-time-setup screen.
async function fetchWithTimeout(url, options, ms){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), ms || 20000);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  } finally {
    clearTimeout(t);
  }
}
async function loadStaffListForLogin(){
  const attempts = 3;
  let lastErr = null;
  for(let i=0;i<attempts;i++){
    try{
      const res = await fetchWithTimeout('/api/staff-list', {credentials:'same-origin'}, 25000);
      if(res.ok){
        const json = await res.json();
        state.data = defaultData();
  bootClinicGuards();
      bootClinicGuards();
        bootClinicGuards();
        state.data.staff = json.staff || [];
        ensureStaffAuthMethods();
        state.loadError = null;
        try{ localStorage.setItem('mmc_staff_cache', JSON.stringify(state.data.staff.map(s=>({name:s.name,role:s.role,owner:!!s.owner,authMethod:s.authMethod||'pin',totpEnabled:!!s.totpEnabled})))); }catch(e){}
        state.loading = false;
        render();
        return;
      }
      lastErr = 'Server responded with ' + res.status;
    } catch(e){
      lastErr = e && e.name === 'AbortError' ? 'Request timed out' : (e && e.message) || 'Network error';
    }
    if(i < attempts-1) await new Promise(r=>setTimeout(r, 1500 * (i+1)));
  }
  try{
    const cached = JSON.parse(localStorage.getItem('mmc_staff_cache')||'null');
    if(cached && Array.isArray(cached) && cached.length){
      state.data = defaultData();
  bootClinicGuards();
      bootClinicGuards();
      state.data.staff = cached;
      state.loadError = null;
      state.loginError = 'Using a cached staff list — the server may still be waking up. Log in, or tap Try again if login fails.';
      state.loading = false;
      render();
      return;
    }
  }catch(e){}
  state.loadError = 'Could not reach the clinic server' + (lastErr ? ' ('+lastErr+').' : '.') + ' If this site is on a free host it may take up to a minute to wake up — wait and try again.';
  state.loading = false;
  render();
}

function digitsPhone(phone){
  let d = normPhone(phone);
  if(!d) return '';
  if(d.length === 10) d = '91' + d; // India default
  return d;
}
function whatsappUrl(phone, text){
  const d = digitsPhone(phone);
  if(!d) return null;
  return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '');
}
function shareWhatsApp(phone, text){
  const url = whatsappUrl(phone, text);
  if(!url){ alert('No valid phone number to open WhatsApp.'); return; }
  window.open(url, '_blank', 'noopener');
}
function ownerWhatsAppPhone(){
  const ci = state.data.clinicInfo || {};

}
async function remindAllDueList(){
  const tomorrow = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); })();
  const targets = [];
  const seen = new Set();
  (state.data.patients||[]).forEach(p=>{
    if(!p.phone) return;
    (p.visits||[]).forEach(v=>{
      if(v.followUpDate===tomorrow && !seen.has(p.id)){
        seen.add(p.id);
        targets.push(p);
      }
    });
  });
  if(!targets.length){ alert('No follow-ups tomorrow with a phone number.'); return; }
  if(!confirm(`Open WhatsApp for ${targets.length} patient(s) due tomorrow?`)) return;
  const clinic = (state.data.clinicInfo||{}).name||'clinic';
  for(const p of targets){
    shareWhatsApp(p.phone, `Namaste ${p.name}, reminder from ${clinic}: your follow-up is tomorrow (${fmtDate(tomorrow)}). Please visit as planned.`);
  }
}
function dailyCloseWhatsAppText(){
  const today = todayStr();
  let visits=0, completed=0, waiting=0, tokens=0, revenue=0, collected=0, outstanding=0;
  (state.data.patients||[]).forEach(p=>{
    (p.visits||[]).forEach(v=>{
      if(v.date!==today) return;
      visits++;
      if(v.token!=null) tokens++;
      if(visitStatus(v)==='completed') completed++; else waiting++;
      if(v.billing){
        const total = billingTotal(v.billing);
        revenue += total;
        if(v.billing.paid) collected += total; else outstanding += total;
      }
    });
  });
  const clinic = (state.data.clinicInfo||{}).name||'MMC';
  return `${clinic} daily close — ${fmtDate(today)}\nTokens: ${tokens}\nVisits: ${visits} (done ${completed}, open ${waiting})\nRevenue: ₹${Math.round(revenue)}\nCollected: ₹${Math.round(collected)}\nOutstanding: ₹${Math.round(outstanding)}`;
}

function speechSupported(){

function startDictation(fieldId){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){ alert('Voice dictation is not supported in this browser. Use Chrome or Edge.'); return; }
  const el = document.getElementById(fieldId);
  if(!el) return;
  try{
    if(state._recog){ try{ state._recog.stop(); }catch(e){} }
    const rec = new Rec();
    rec.lang = state.uiLang==='kn' ? 'kn-IN' : 'en-IN';
    rec.interimResults = false;
    rec.continuous = false;
    rec.onresult = ev=>{
      const text = Array.from(ev.results).map(r=>r[0].transcript).join(' ').trim();
      if(!text) return;
      const cur = el.value || '';
      el.value = cur ? (cur.replace(/\s+$/,'') + ' ' + text) : text;
      el.dispatchEvent(new Event('input', {bubbles:true}));
    };
    rec.onerror = ()=>{};
    state._recog = rec;
    rec.start();
  }catch(e){
    alert('Could not start microphone.');
  }
}

// Offline-capable QR (byte mode, small payloads). Adapted from public-domain compact QR logic.
function copyPatientLink(patientId){
  const url = patientQrPayload(patientId);
  const done = ()=>{
    const el = document.getElementById('copy-link-msg');
    if(el){ el.textContent = 'Link copied'; setTimeout(()=>{ if(el) el.textContent=''; }, 2000); }
    else try{ alert('Link copied:\\n'+url); }catch(e){}
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>{
      // fallback
      const ta = document.createElement('textarea');
      ta.value = url; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ prompt('Copy this patient link:', url); }
      document.body.removeChild(ta);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ prompt('Copy this patient link:', url); }
    document.body.removeChild(ta);
  }
}
function patientQrPayload(patientId){
  const base = (typeof location !== 'undefined' && location.origin) ? location.origin : '';
  // Path form works better when scanning from phone camera than #hash
  return base.replace(/\/$/,'') + '/patient/' + encodeURIComponent(patientId);
}
function patientQrImgHTML(patientId, size){
  if(!patientId) return '';
  const s = size || 72;
  const payload = patientQrPayload(patientId);
  const data = encodeURIComponent(payload);
  // Primary + fallbacks (some networks block one host)
  const src1 = `https://api.qrserver.com/v1/create-qr-code/?size=${s}x${s}&margin=1&ecc=M&data=${data}`;
  const src2 = `https://quickchart.io/qr?size=${s}&margin=1&text=${data}`;
  return `<div class="opdx-qr-wrap" title="${esc(payload)}">
    <img class="patient-qr" width="${s}" height="${s}" alt="Patient QR"
      src="${src1}"
      onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='${src2.replace(/'/g,"\\'")}';}else{this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.textContent='QR unavailable offline — use patient ID ${esc(patientId)}');}">
    <div class="faint">Scan to open file</div>
  </div>`;
}
function readPatientDeepLinkId(){
  try{
    const path = (location.pathname||'');
    const pm = path.match(/^\/patient\/([^/]+)\/?$/i);
    if(pm) return decodeURIComponent(pm[1]);
    const q = new URLSearchParams(location.search||'');
    if(q.get('patient')) return q.get('patient');
    if(q.get('p')) return q.get('p');
    const h = (location.hash||'').replace(/^#/, '');
    const hm = h.match(/^\/?patient\/(.+)$/i) || h.match(/^p\/(.+)$/i);
    if(hm) return decodeURIComponent(hm[1]);
  }catch(e){}
  return null;
}
function stashPendingPatient(id){
  if(!id) return;
  try{ sessionStorage.setItem('mmc_pending_patient', id); }catch(e){}
}
function consumePendingPatientId(){
  let id = readPatientDeepLinkId();
  if(!id){ try{ id = sessionStorage.getItem('mmc_pending_patient'); }catch(e){} }
  return id;
}
function handlePatientHashRoute(){
  try{
    const id = consumePendingPatientId();
    if(!id) return;
    stashPendingPatient(id);
    if(!state.session.staffName) return; // after login we open it
    if(!state.data || !state.data.patients) return;
    const p = state.data.patients.find(x=>x.id===id);
    if(!p){
      // soft match: case-insensitive / trim
      const p2 = state.data.patients.find(x=>(x.id||'').toUpperCase()===id.toUpperCase());
      if(!p2) return;
      try{ sessionStorage.removeItem('mmc_pending_patient'); }catch(e){}
      if(state.route!=='patient' || state.routeParams.patientId!==p2.id) go('patient',{patientId:p2.id});
      return;
    }
    try{ sessionStorage.removeItem('mmc_pending_patient'); }catch(e){}
    if(state.route!=='patient' || state.routeParams.patientId!==p.id) go('patient',{patientId:p.id});
  }catch(e){}
}

function openCommandPalette(){

function cmdResults(){
  const q = (state.cmdQuery||'').trim().toLowerCase();
  const items = [];
  // Quick actions
  const actions = [
    {label:'Dashboard', run:()=>go('dashboard')},
    {label:'New visit / Check in', run:()=>go('newVisit')},
    {label:'Register patient', run:()=>go('newPatient')},

    {label:'Recall register', run:()=>go('recall')},
    {label:'Duty roster', run:()=>go('roster')},
  ];
  actions.forEach(a=>{
    if(!q || a.label.toLowerCase().includes(q)) items.push({type:'action', title:a.label, subtitle:'Go', run:a.run});
  });
  // Patients
  (state.data.patients||[]).forEach(p=>{
    const hay = (p.name+' '+p.id+' '+(p.phone||'')).toLowerCase();
    if(q && !hay.includes(q)) return;
    items.push({
      type:'patient',
      title: p.name,
      subtitle: p.id + (p.phone ? ' · '+p.phone : ''),
      run: ()=>go('patient',{patientId:p.id})
    });
  });
  return items.slice(0, 25);

function onCmdInput(v){
  state.cmdQuery = v;
  state.cmdIndex = 0;
  const list = document.getElementById('cmd-list');
  if(list) list.innerHTML = commandPaletteListHTML();
}
function commandPaletteListHTML(){
  const items = cmdResults();
  if(!items.length) return `<div class="cmd-empty">No matches</div>`;
  return items.map((it,i)=>`
    <button type="button" class="cmd-item ${i===state.cmdIndex?'active':''}"
      onmouseenter="state.cmdIndex=${i}"
      onclick="runCmdItem(${i})">
      <span>${esc(it.title)}</span>
      <span class="cmd-meta">${esc(it.subtitle||'')}</span>
    </button>`).join('');
}
function runCmdItem(i){
  const items = cmdResults();
  const it = items[i];
  if(!it) return;
  closeCommandPalette();
  it.run();
}
function commandPaletteHTML(){
  if(!state.cmdOpen) return '';
  return `<div class="cmd-overlay" onclick="if(event.target===this)closeCommandPalette()">
    <div class="cmd-panel" role="dialog" aria-label="Quick search">
      <input id="cmd-input" class="cmd-input" placeholder="${esc(t('Search'))}" value="${esc(state.cmdQuery)}"
        oninput="onCmdInput(this.value)"
        onkeydown="onCmdKey(event)">
      <div id="cmd-list" class="cmd-list">${commandPaletteListHTML()}</div>
      <div class="cmd-hint"><span>↑↓ Navigate · Enter open · Esc close</span><span>Ctrl/⌘ K</span></div>
    </div>
  </div>`;
}
function onCmdKey(e){
  const items = cmdResults();
  if(e.key === 'ArrowDown'){ e.preventDefault(); state.cmdIndex = Math.min(state.cmdIndex+1, items.length-1); document.getElementById('cmd-list').innerHTML = commandPaletteListHTML(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); state.cmdIndex = Math.max(state.cmdIndex-1, 0); document.getElementById('cmd-list').innerHTML = commandPaletteListHTML(); }
  else if(e.key === 'Enter'){ e.preventDefault(); runCmdItem(state.cmdIndex); }
  else if(e.key === 'Escape'){ e.preventDefault(); closeCommandPalette(); }
}
document.addEventListener('keydown', e=>{
  if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){
    if(!state.session.staffName) return;
    e.preventDefault();
    if(state.cmdOpen) closeCommandPalette();
    else openCommandPalette();
  }
  if(e.key === 'Escape' && state.cmdOpen) closeCommandPalette();
});

/* ============================= IDLE AUTO-LOGOUT ============================= */
// A shared front-desk computer shouldn't stay signed in indefinitely, so we
// log out automatically after a stretch of no keyboard/mouse/touch activity.
let idleTimer = null;
function idleTimeoutMs(){
  const m = state.idleMinutes || 15;
  return Math.max(5, m) * 60 * 1000;
}
function setIdleMinutes(mins){
  state.idleMinutes = Math.max(5, parseInt(mins,10) || 15);
  try{ localStorage.setItem('mmc_idle_min', String(state.idleMinutes)); }catch(e){}
  resetIdleTimer();
  render();
}
function resetIdleTimer(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  if(!state.session.staffName) return;
  idleTimer = setTimeout(()=>{
    if(state.session.staffName){
      logout();
      state.loginError = 'Logged out after ' + (state.idleMinutes||15) + ' minutes of inactivity.';
      render();
    }
  }, idleTimeoutMs());
}
['mousedown','mousemove','keydown','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, resetIdleTimer, {passive:true});
});
// Coming back to this tab counts as activity too — switching tabs to check
// something else and returning a minute later shouldn't cost the session.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') resetIdleTimer();
});

function lastVisitDate(p){
  if(!p.visits || p.visits.length===0) return null;
  return p.visits.slice().sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id))[0].date;
}

// Normalizes to digits-only so "98765 43210", "(987) 654-3210" etc. all
// compare equal — a punctuation difference shouldn't hide a real duplicate.
function normPhone(p){ return (p||'').replace(/\D/g,''); }
function phoneDuplicates(phone, excludeId){
  const np = normPhone(phone);
  if(!np) return [];
  return state.data.patients.filter(p=> p.id!==excludeId && normPhone(p.phone)===np);
}
function aadhaarDuplicates(aadhaar, excludeId){
  const a = (aadhaar||'').replace(/\s/g,'');
  if(!a || a.length !== 12) return [];
  return state.data.patients.filter(p=> p.id!==excludeId && (p.aadhaar||'').replace(/\s/g,'') === a);
}
function namePhoneDuplicates(name, phone, excludeId){
  const np = normPhone(phone);
  const n = (name||'').trim().toLowerCase();
  if(!np || !n) return [];
  return state.data.patients.filter(p=>{
    if(p.id===excludeId) return false;
    if(normPhone(p.phone)!==np) return false;
    return (p.name||'').trim().toLowerCase() === n;
  });
}
function findRegisterDuplicates(name, phone, aadhaar, excludeId){
  const seen = new Set();
  const out = [];
  function add(list, reason){
    list.forEach(p=>{
      if(seen.has(p.id)) return;
      seen.add(p.id);
      out.push({patient:p, reason});
    });
  }
  add(namePhoneDuplicates(name, phone, excludeId), 'Same name and phone');
  add(aadhaarDuplicates(aadhaar, excludeId), 'Same Aadhaar number');
  add(phoneDuplicates(phone, excludeId), 'Same phone number');
  return out;
}
function dupeWarningHTML(matches){
  // matches: array of patients OR {patient, reason}
  const norm = matches.map(m => m.patient ? m : {patient:m, reason:'Same phone number'});
  const cards = norm.map(({patient:p, reason})=>`
    <div class="card" style="padding:10px 12px;margin-bottom:6px;">
      <strong>${esc(p.name)}</strong> <span class="pill">${p.id}</span>
      <div class="faint">${esc(reason)} · ${esc(displayAge(p))}/${esc(p.sex)} · ${(p.visits||[]).length} visit(s)${lastVisitDate(p)?' · last visit '+fmtDate(lastVisitDate(p)):''}</div>
      <button class="btn btn-sm" style="margin-top:6px;" onclick="go('patient',{patientId:'${p.id}'})">Use this record instead</button>
    </div>`).join('');
  return `
    <div class="banner" style="background:var(--accent-tint);color:var(--accent-dark,#B8860B);margin-top:10px;">
      <strong>⚠ Possible duplicate patient.</strong> Check the matches below before creating a new record. Family members may share one phone — only continue if this is a different person.
    </div>
    ${cards}
    <button class="btn btn-ghost btn-sm" onclick="confirmRegisterAnyway()">This is a different person — register anyway</button>`;
}
function confirmRegisterAnyway(){
  state.regDupeAcknowledged = true;
  saveNewPatient();
}
async function saveNewPatient(){
  const name = document.getElementById('reg-name').value.trim();
  const dob = document.getElementById('reg-dob').value;
  const age = document.getElementById('reg-age').value.trim();
  const sex = document.getElementById('reg-sex').value;
  const phone = document.getElementById('reg-phone').value.trim();
  const address = document.getElementById('reg-address').value.trim();
  const allergies = document.getElementById('reg-allergies').value.trim();
  const chronicConditions = document.getElementById('reg-chronic').value.trim();
  const bloodGroup = document.getElementById('reg-blood-group').value;
  const emergencyContactName = document.getElementById('reg-emergency-name').value.trim();
  const emergencyContactPhone = document.getElementById('reg-emergency-phone').value.trim();
  const aadhaar = document.getElementById('reg-aadhaar').value.trim();
  const err = document.getElementById('reg-error');
  if(!name || (!dob && !age) || !sex || !phone || !address){
    err.textContent = 'Name, date of birth (or age), sex, phone and address are all required.'; return;
  }
  if(aadhaar && !/^\d{12}$/.test(aadhaar.replace(/\s/g,''))){
    err.textContent = 'Aadhaar number should be 12 digits, or left blank.'; return;
  }
  err.textContent = '';
  if(!state.regDupeAcknowledged){
    const matches = findRegisterDuplicates(name, phone, aadhaar, null);
    if(matches.length){
      const warnEl = document.getElementById('reg-dupe-warning');
      if(warnEl) warnEl.innerHTML = dupeWarningHTML(matches);
      return;
    }
  }
  const patient = {
    id: newPatientId(), name, dob: dob||'', age, sex, phone, address, allergies, chronicConditions,
    bloodGroup, emergencyContactName, emergencyContactPhone, aadhaar: aadhaar.replace(/\s/g,''),
    pastSurgeries: '', familyHistory: '',
    registeredDate: todayStr(), visits: [], growthRecords: [], vaccinations: [], certificates: []
  };
  state.data.patients.push(patient);
  logAudit('Registered patient', `${patient.name} (${patient.id})`);
  const ok = await saveData();
  if(!ok){ err.textContent = state.saveError; render(); return; }
  go('patient', {patientId: patient.id});
}

  return (state.data.appointments||[])
    .filter(a=>a.date===date && a.status!=='cancelled')
    .sort((a,b)=> (a.time||'').localeCompare(b.time||''));
}
function shiftApptDate(deltaDays){
  const d = new Date((state.apptDate||todayStr())+'T00:00:00');
  d.setDate(d.getDate()+deltaDays);
  state.apptDate = d.toISOString().slice(0,10);
  render();
}

// True if some other booked/checked-in appointment already has this doctor
// at this exact date+time. excludeId lets a reschedule ignore itself.
function timeToMinutes(t){
  if(!t || !String(t).includes(':')) return null;
  const [h,m] = String(t).split(':').map(Number);
  if(isNaN(h)) return null;
  return h*60 + (m||0);
}
function apptConflict(date, time, doctorName, excludeId){
  if(!doctorName) return null;
  return (state.data.appointments||[]).find(a=>
    a.id!==excludeId && a.date===date && a.time===time && a.doctorName===doctorName &&
    (a.status==='booked' || a.status==='checked-in')
  );
}
// Soft conflicts: same doctor within ±slot minutes (default 20)
function apptSoftConflicts(date, time, doctorName, excludeId, windowMins){
  const win = windowMins != null ? windowMins : 20;
  const t0 = timeToMinutes(time);
  if(!doctorName || t0==null) return [];
  return (state.data.appointments||[]).filter(a=>{
    if(a.id===excludeId || a.date!==date || a.doctorName!==doctorName) return false;
    if(a.status!=='booked' && a.status!=='checked-in') return false;
    const t1 = timeToMinutes(a.time);
    if(t1==null) return false;
    const diff = Math.abs(t1 - t0);
    return diff > 0 && diff <= win;
  });
}
function checkApptConflictsLive(){
  const dateEl = document.getElementById('appt-date');
  const timeEl = document.getElementById('appt-time');
  const docEl = document.getElementById('appt-doctor');
  const box = document.getElementById('appt-conflict-box');
  if(!box || !dateEl || !timeEl) return;
  const date = dateEl.value, time = timeEl.value;
  const doctorName = docEl ? docEl.value : '';
  const excludeId = state.draftAppt && state.draftAppt.editId;
  if(!date || !time || !doctorName){ box.innerHTML = ''; return; }
  const exact = apptConflict(date, time, doctorName, excludeId);
  const soft = apptSoftConflicts(date, time, doctorName, excludeId, 20);
  let html = '';
  if(exact){
    const label = exact.patientId ? (state.data.patients.find(p=>p.id===exact.patientId)||{}).name || exact.patientId : exact.name;
    html += `<div class="banner banner-error" style="margin:0 0 8px;">⚠ Exact conflict: ${esc(doctorName)} already has <strong>${esc(label)}</strong> at ${esc(time)}.</div>`;
  }
  if(soft.length){
    const lines = soft.map(a=>{
      const label = a.patientId ? (state.data.patients.find(p=>p.id===a.patientId)||{}).name || a.patientId : a.name;
      return `${esc(a.time)} — ${esc(label||'Patient')}`;
    }).join('<br>');
    html += `<div class="banner" style="background:var(--accent-tint);color:var(--accent-dark);margin:0;">Nearby slot (±20 min) for ${esc(doctorName)}:<br>${lines}<div class="faint" style="margin-top:4px;">You can still book — confirm when saving.</div></div>`;
  }
  box.innerHTML = html;
}

async function saveAppointment(){
  const da = state.draftAppt;
  const date = document.getElementById('appt-date').value;
  const time = document.getElementById('appt-time').value;
  const doctorEl = document.getElementById('appt-doctor');
  const doctorName = doctorEl ? doctorEl.value : '';
  const notes = document.getElementById('appt-notes').value.trim();
  const errEl = document.getElementById('appt-error');
  let guestName = '', guestPhone = '';
  if(!da.patientId){
    guestName = document.getElementById('appt-guest-name').value.trim();
    guestPhone = document.getElementById('appt-guest-phone').value.trim();
  }
  if(!date || !time){ errEl.textContent = 'Date and time are both required.'; return; }
  if(!da.patientId && !guestName){ errEl.textContent = 'Select an existing patient, or enter a name for someone not yet registered.'; return; }
  errEl.textContent = '';

  const conflict = apptConflict(date, time, doctorName, da.editId);
  if(conflict){
    const conflictLabel = conflict.patientId ? (state.data.patients.find(p=>p.id===conflict.patientId)||{}).name || conflict.patientId : conflict.name;
    if(!confirm(`${doctorName} already has an appointment with ${conflictLabel} at ${time} on ${fmtDate(date)}. Book this one anyway?`)) return;
  } else {
    const soft = apptSoftConflicts(date, time, doctorName, da.editId, 20);
    if(soft.length){
      const lines = soft.map(a=>{
        const label = a.patientId ? (state.data.patients.find(p=>p.id===a.patientId)||{}).name || a.patientId : a.name;
        return `• ${a.time} — ${label||'Patient'}`;
      }).join('\n');
      if(!confirm(`${doctorName} has nearby appointments on ${fmtDate(date)}:\n${lines}\n\nBook this ${time} slot anyway?`)) return;
    }
  }

  if(!state.data.appointments) state.data.appointments = [];
  const apptPatientLabel = da.patientId
    ? (state.data.patients.find(p=>p.id===da.patientId)||{}).name || da.patientId
    : guestName;

  if(da.editId){
    const a = state.data.appointments.find(a=>a.id===da.editId);
    if(!a){ errEl.textContent = 'That appointment no longer exists.'; return; }
    a.patientId = da.patientId || null;
    a.name = da.patientId ? '' : guestName;
    a.phone = da.patientId ? '' : guestPhone;
    a.date = date; a.time = time; a.doctorName = doctorName||''; a.notes = notes;
    logAudit('Rescheduled appointment', `${apptPatientLabel} — ${fmtDate(date)} ${time}`);
  } else {
    state.data.appointments.push({
      id: 'A'+Date.now().toString(36).toUpperCase(),
      patientId: da.patientId || null,
      name: da.patientId ? '' : guestName,
      phone: da.patientId ? '' : guestPhone,
      date, time, doctorName: doctorName||'', notes,
      status: 'booked', bookedBy: state.session.staffName||'', createdAt: new Date().toISOString()
    });
    logAudit('Booked appointment', `${apptPatientLabel} — ${fmtDate(date)} ${time}`);
  }
  const ok = await saveData();
  if(!ok){ errEl.textContent = state.saveError; render(); return; }
  state.apptDate = date;
  state.draftAppt = null;
  go('appointments');
}

async function cancelAppointment(id){
  const a = (state.data.appointments||[]).find(a=>a.id===id);
  if(!a) return;
  if(!confirm('Cancel this appointment? This can\'t be undone.')) return;
  const label = a.patientId ? (state.data.patients.find(p=>p.id===a.patientId)||{}).name || a.patientId : a.name;
  a.status = 'cancelled';
  logAudit('Cancelled appointment', `${label} — ${fmtDate(a.date)} ${a.time}`);
  const ok = await saveData();
  if(!ok) render();
  else render();
}
